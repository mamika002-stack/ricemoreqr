<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RiceMore">
<meta name="description" content="RiceMore — Pilavdan daha fazlası. QR menü ve online sipariş.">
<title>RiceMore · Menü & Sipariş</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,400..600&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
  /* ============================= TEMA ============================= */
  :root{
    --bg:#0B0C0E; --bg-2:#121418;
    --glass:rgba(24,26,32,.62); --glass-strong:rgba(18,20,24,.88);
    --glass-border:rgba(212,175,55,.2); --glass-hi:rgba(255,255,255,.06);
    --text:#FFFFFF; --text-dim:#E0E0E0; --text-faint:#9A9DA5;
    --gold:#D4AF37; --gold-2:#E6CA65; --gold-3:#B8860B; --gold-ink:#1A1405; --gold-soft:rgba(212,175,55,.14);
    --warm:#E38A55; --warm-soft:rgba(227,138,85,.16);
    --ok:#7FC79A; --ok-soft:rgba(127,199,154,.16);
    --danger:#E8705D; --danger-soft:rgba(232,112,93,.16);
    --warn:#F0BE4A; --warn-soft:rgba(240,190,74,.16);
    --info:#7EB6E6;
    /* yönetim paneli için eski isimler (aynı tema) */
    --accent:var(--gold); --accent-ink:var(--gold-ink); --accent-soft:var(--gold-soft);
    --panel:rgba(24,26,32,.66); --panel-2:rgba(32,34,42,.72); --bg-elev:rgba(8,9,11,.55); --border:var(--glass-border);
    --radius:12px; --radius-lg:20px; --shadow:0 18px 50px rgba(0,0,0,.55);
    --ease:cubic-bezier(.2,.8,.2,1);
    --font-display:'Fraunces',Georgia,'Iowan Old Style',serif;
    --font-body:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --font-num:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;
    overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;
    background:
      radial-gradient(40vmax 30vmax at 50% -6%, rgba(212,175,55,.16), transparent 62%),
      radial-gradient(30vmax 26vmax at 100% 30%, rgba(184,134,11,.08), transparent 60%),
      radial-gradient(34vmax 30vmax at 0% 75%, rgba(212,175,55,.06), transparent 62%),
      linear-gradient(180deg, #121418 0%, #0B0C0E 55%);
    animation:drift 26s ease-in-out infinite alternate;}
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1);}to{transform:translate3d(-2vmax,1.5vmax,0) scale(1.05);}}
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important;} }
  button,input,select,textarea{font-family:inherit;color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;}
  img{max-width:100%;display:block;}
  svg{flex:none;}
  .glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);
    border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi), 0 14px 40px rgba(0,0,0,.35);}

  /* ============================= AÇILIŞ ============================= */
  .boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  .boot-logo{max-height:96px;width:auto;animation:breathe 1.6s ease-in-out infinite;filter:drop-shadow(0 8px 24px rgba(212,175,55,.25));}
  .boot-name{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-.02em;}
  .boot-bar{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;position:relative;}
  .boot-bar::after{content:'';position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:load 1.1s ease-in-out infinite;}
  @keyframes load{from{transform:translateX(-100%);}to{transform:translateX(260%);}}
  @keyframes breathe{50%{transform:scale(1.06);}}

  /* ============================= MÜŞTERİ: DÜZEN ============================= */
  .c-wrap{max-width:1080px;margin:0 auto;padding:calc(12px + var(--safe-t)) 14px calc(120px + var(--safe-b));}

  /* Hero */
  .hero{position:relative;overflow:hidden;padding:20px 18px 18px;border-radius:28px;animation:rise .6s var(--ease) both;}
  .hero::before{content:'';position:absolute;width:340px;height:260px;left:50%;margin-left:-170px;top:-150px;border-radius:50%;
    background:radial-gradient(circle, rgba(230,202,101,.35), rgba(212,175,55,.08) 55%, transparent 70%);pointer-events:none;}
  .hero::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.35;
    background-image:radial-gradient(rgba(212,175,55,.16) 1px, transparent 1.2px);background-size:16px 16px;
    -webkit-mask-image:radial-gradient(circle at 50% 0%, #000, transparent 70%);mask-image:radial-gradient(circle at 50% 0%, #000, transparent 70%);}
  .hero > *{position:relative;z-index:1;}
  .hero{text-align:center;}
  .hero-brand{display:flex;flex-direction:column;align-items:center;}
  .brand-trigger{display:inline-flex;justify-content:center;cursor:default;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  .hero-logo{display:block;max-height:75px;width:auto;margin:0 auto;pointer-events:none;
    filter:drop-shadow(0 6px 22px rgba(212,175,55,.28));animation:logoin .8s var(--ease) both;}
  @keyframes logoin{from{opacity:0;transform:translateY(-6px) scale(.96);}to{opacity:1;transform:none;}}
  .brand-name{font-family:var(--font-display);font-size:clamp(30px,8.4vw,44px);font-weight:700;letter-spacing:-.025em;margin:0;line-height:1;
    background:linear-gradient(180deg,#F0DC8A 10%,#B8860B 95%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand-tag{font-family:var(--font-display);font-style:italic;font-weight:400;color:var(--gold-2);margin:10px 0 0;font-size:15.5px;letter-spacing:.02em;
    -webkit-user-select:none;user-select:none;}
  .brand-rule{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:12px;color:var(--gold);}
  .brand-rule::before,.brand-rule::after{content:'';width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));}
  .brand-rule::after{transform:scaleX(-1);}
  .brand-rule i{width:5px;height:5px;transform:rotate(45deg);background:var(--gold);}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .hero-info{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px;}
  .hero-info:empty{display:none;}
  .info-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;max-width:100%;
    background:rgba(255,255,255,.05);border:1px solid var(--glass-border);font-size:12.5px;color:var(--text-dim);font-weight:600;text-decoration:none;}
  .info-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .info-chip svg{width:14px;height:14px;color:var(--gold);}
  .info-chip.link{transition:border-color .2s, background .2s;} .info-chip.link:hover{border-color:rgba(212,175,55,.5);background:var(--gold-soft);}
  .info-chip .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .info-chip.is-open{color:var(--ok);} .info-chip.is-open .dot{background:var(--ok);animation:livepulse 2s infinite;}
  .info-chip.is-closed{color:var(--danger);} .info-chip.is-closed .dot{background:var(--danger);}
  .info-chip.emergency{background:rgba(232,112,93,.16);border-color:rgba(232,112,93,.55);color:#FFB3A6;font-weight:800;}
  .info-chip.emergency .dot{background:var(--danger);animation:emgpulse 1.4s infinite;}
  .info-chip.emergency span{white-space:normal;}
  @keyframes emgpulse{0%{box-shadow:0 0 0 0 rgba(232,112,93,.7);}100%{box-shadow:0 0 0 9px rgba(232,112,93,0);}}

  /* Arama + kategori çubuğu */
  .toolbar{position:sticky;top:calc(8px + var(--safe-t));z-index:20;margin:12px 0 6px;padding:10px;border-radius:22px;
    background:var(--glass-strong);animation:rise .6s .08s var(--ease) both;}
  .search{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 14px;border-radius:15px;
    background:rgba(5,6,8,.45);border:1px solid var(--glass-border);transition:border-color .2s, box-shadow .2s;}
  .search:focus-within{border-color:rgba(212,175,55,.55);box-shadow:0 0 0 4px rgba(212,175,55,.12);}
  .search > svg{width:18px;height:18px;color:var(--text-faint);}
  .search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:16px;color:var(--text);}
  .search input::placeholder{color:var(--text-faint);}
  .search input::-webkit-search-cancel-button{display:none;}
  .search-clear{width:32px;height:32px;border-radius:10px;border:0;background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--text-dim);}
  .search-clear svg{width:14px;height:14px;}
  .search-clear[hidden]{display:none;}
  .chips{display:flex;gap:8px;overflow-x:auto;margin:6px -4px -6px;padding:6px 4px 10px;scroll-snap-type:x proximity;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none;scroll-snap-align:start;padding:9px 16px;border-radius:99px;border:1px solid var(--glass-border);background:rgba(255,255,255,.04);
    font-weight:700;font-size:13.5px;color:var(--text-dim);white-space:nowrap;transition:background .25s, color .25s, border-color .25s, transform .2s var(--ease), box-shadow .25s;}
  .chip:hover{color:var(--text);border-color:rgba(212,175,55,.35);}
  .chip:active{transform:scale(.95);}
  .chip.active{background:linear-gradient(135deg,var(--gold-2),var(--gold) 60%,var(--gold-3));border-color:transparent;color:var(--gold-ink);
    box-shadow:0 4px 12px rgba(212,175,55,.28);}
  .chip .cnt{opacity:.6;font-weight:600;margin-left:4px;font-size:12px;}

  /* Bölümler */
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:24px 4px 12px;}
  .sec-head h2{font-family:var(--font-display);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em;}
  .sec-head span{font-size:12.5px;color:var(--text-faint);font-weight:600;}

  /* Ürün kartları — mobil: yatay kart, geniş ekran: dikey ızgara */
  .items{display:grid;grid-template-columns:1fr;gap:12px;}
  .item{position:relative;display:grid;grid-template-columns:1fr 112px;gap:12px;padding:12px;border-radius:22px;overflow:hidden;
    background:linear-gradient(160deg, rgba(30,32,40,.62), rgba(22,24,30,.58));border:1px solid var(--glass-border);
    box-shadow:inset 0 1px 0 var(--glass-hi);
    transition:transform .4s var(--ease), border-color .3s, box-shadow .4s var(--ease);
    animation:rise .55s var(--ease) both;animation-delay:calc(min(var(--i,0),14) * 45ms);}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .item-media{grid-column:2;grid-row:1;position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;
    background:radial-gradient(circle at 30% 25%, rgba(212,175,55,.22), transparent 60%), linear-gradient(145deg,#1E2128,#181A20);}
  .item-media img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.02);transition:transform .7s var(--ease), opacity .5s ease;}
  .item-media img.ok{opacity:1;transform:none;}
  .item-media .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(212,175,55,.55);}
  .item-media .ph svg{width:42%;height:42%;}
  .item-media::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,.18) 50%, transparent 65%);transform:translateX(-120%);transition:transform .9s var(--ease);}
  .item-body{grid-column:1;grid-row:1;display:flex;flex-direction:column;min-width:0;padding:2px 0;}
  .item-name{font-weight:800;font-size:15.5px;margin:0;line-height:1.3;letter-spacing:-.005em;}
  .item-desc{font-size:12.8px;color:var(--text-dim);line-height:1.45;margin:5px 0 0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .item-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px;}
  .price{font-weight:800;font-size:16.5px;color:var(--gold-2);letter-spacing:-.01em;white-space:nowrap;}
  .badge{position:absolute;top:8px;left:8px;z-index:2;padding:4px 9px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:.02em;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 4px 12px rgba(0,0,0,.25);}
  .badge.yeni{background:rgba(126,182,230,.92);color:#08192A;}
  .badge.populer{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--gold-ink);}
  .badge.sef{background:rgba(227,138,85,.95);color:#2A1206;}
  .sold{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:rgba(6,7,9,.66);-webkit-backdrop-filter:grayscale(1);backdrop-filter:grayscale(1);}
  .item-media .sold span,.dt-media .sold span{padding:6px 14px;border-radius:99px;border:1px solid rgba(212,175,55,.6);background:rgba(11,12,14,.78);color:var(--gold-2);
    font-size:11px;font-weight:800;letter-spacing:.2em;box-shadow:0 6px 18px rgba(0,0,0,.4);}
  .item.soldout .price{color:var(--text-faint);text-decoration:line-through;text-decoration-color:rgba(212,175,55,.5);}
  .item.soldout .item-body{opacity:.6;}
  @media (hover:hover){
    .item:hover{transform:translateY(-4px);border-color:rgba(212,175,55,.32);box-shadow:inset 0 1px 0 var(--glass-hi), 0 18px 40px rgba(0,0,0,.4);}
    .item:hover .item-media img.ok{transform:scale(1.07);}
    .item:hover .item-media::after{transform:translateX(120%);}
  }
  .item:active{transform:scale(.99);}
  @media (min-width:640px){
    .c-wrap{padding-left:20px;padding-right:20px;}
    .hero{padding:28px 28px 24px;}
    .items{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
    .item{grid-template-columns:1fr;padding:0;gap:0;}
    .item-media{grid-column:1;grid-row:1;aspect-ratio:4/3;border-radius:0;}
    .item-body{grid-row:2;padding:14px 16px 16px;}
    .badge{top:12px;left:12px;}
  }

  /* Ekle / adet butonları */
  .add-btn{width:38px;height:38px;border-radius:13px;border:0;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--gold-2),var(--gold) 60%,var(--gold-3));color:var(--gold-ink);
    box-shadow:0 6px 16px rgba(212,175,55,.3);transition:transform .25s var(--ease), box-shadow .25s;}
  .add-btn svg{width:18px;height:18px;}
  .add-btn:hover{transform:translateY(-1px) scale(1.05);box-shadow:0 10px 22px rgba(212,175,55,.4);}
  .add-btn:active{transform:scale(.9);}
  .add-btn[disabled]{background:rgba(255,255,255,.06);color:var(--text-faint);box-shadow:none;cursor:not-allowed;transform:none;}
  .pick-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:13px;border:0;font-weight:800;font-size:13.5px;
    background:linear-gradient(135deg,var(--gold-2),var(--gold) 60%,var(--gold-3));color:var(--gold-ink);box-shadow:0 6px 16px rgba(212,175,55,.3);
    transition:transform .25s var(--ease), box-shadow .25s;}
  .pick-btn svg{width:14px;height:14px;}
  .pick-btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(212,175,55,.4);}
  .pick-btn:active{transform:scale(.95);}
  .pick-btn .pb-n{min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:grid;place-items:center;background:var(--gold-ink);color:var(--gold-2);font-size:11px;}
  .pick-btn[disabled]{background:rgba(255,255,255,.06);color:var(--text-faint);box-shadow:none;cursor:not-allowed;transform:none;}
  .pick-btn.closed-btn{height:auto;min-height:38px;padding:6px 10px;font-size:11.5px;line-height:1.2;text-align:center;white-space:normal;max-width:132px;
    background:rgba(232,112,93,.12);color:#FFB3A6;border:1px solid rgba(232,112,93,.4);}
  .bowl-tag{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--gold);}
  .stepper{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:13px;background:rgba(5,6,8,.5);
    border:1px solid rgba(212,175,55,.35);animation:pop .3s var(--ease);}
  .stepper button{width:32px;height:32px;border:0;border-radius:10px;background:none;color:var(--gold-2);display:grid;place-items:center;transition:background .2s;}
  .stepper button:hover{background:var(--gold-soft);}
  .stepper button:active{transform:scale(.9);}
  .stepper button svg{width:15px;height:15px;}
  .stepper .q{min-width:22px;text-align:center;font-weight:800;font-size:14.5px;}
  .stepper.sm button{width:28px;height:28px;} .stepper.sm .q{min-width:18px;font-size:13.5px;}
  @keyframes pop{0%{transform:scale(.85);opacity:.4;}100%{transform:none;opacity:1;}}

  .empty{padding:56px 20px;text-align:center;color:var(--text-dim);}
  .empty .em-ico{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);}
  .empty .em-ico svg{width:30px;height:30px;}
  .empty .big{font-family:var(--font-display);font-size:20px;color:var(--text);margin-bottom:6px;}
  .c-foot{text-align:center;color:var(--text-faint);font-size:12px;margin-top:36px;}
  .c-foot b{font-family:var(--font-display);font-weight:600;color:var(--text-dim);}

  /* ============================= ALT DOCK (PWA hissi) ============================= */
  .dock{position:fixed;left:50%;bottom:calc(12px + var(--safe-b));transform:translateX(-50%);z-index:40;
    width:min(560px, calc(100% - 24px));display:grid;grid-template-columns:64px 1fr 64px;gap:6px;padding:6px;border-radius:24px;
    background:rgba(15,17,21,.78);animation:dockin .6s .2s var(--ease) both;}
  @keyframes dockin{from{opacity:0;transform:translate(-50%,30px);}to{opacity:1;transform:translate(-50%,0);}}
  .dock-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;
    border-radius:18px;color:var(--text-faint);font-size:11px;font-weight:700;transition:color .2s, background .2s;}
  .dock-btn svg{width:21px;height:21px;}
  .dock-btn:hover{color:var(--text);background:rgba(255,255,255,.04);}
  .dock-btn.has-order{color:var(--gold-2);}
  .dock-dot{position:absolute;top:9px;right:17px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(15,17,21,.9);animation:livepulse 2s infinite;}
  .dock-dot.s-hazirlaniyor{background:var(--warn);} .dock-dot.s-yolda{background:var(--warm);} .dock-dot.s-tamamlandi{background:var(--ok);animation:none;}
  .dock-dot.s-iptal,.dock-dot.s-kayip{background:var(--danger);animation:none;}
  .dock-cart{display:flex;align-items:center;gap:12px;padding:9px 14px;border:0;border-radius:18px;min-height:54px;text-align:left;
    background:rgba(255,255,255,.05);color:var(--text-dim);transition:background .35s, color .35s, box-shadow .35s, transform .25s var(--ease);}
  .dock-cart.has{background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,var(--gold-3));color:var(--gold-ink);box-shadow:0 10px 26px rgba(212,175,55,.35);}
  .dock-cart:active{transform:scale(.97);}
  .dock-cart.bump{animation:bump .45s var(--ease);}
  @keyframes bump{30%{transform:scale(1.05);}60%{transform:scale(.98);}}
  .dc-icon{position:relative;display:grid;place-items:center;}
  .dc-icon svg{width:22px;height:22px;}
  .dc-badge{position:absolute;top:-7px;right:-9px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;display:grid;place-items:center;
    background:#0B0C0E;color:var(--gold-2);font-size:10.5px;font-weight:800;}
  .dc-text{flex:1;display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .dc-text small{font-size:11px;font-weight:700;opacity:.72;}
  .dc-text strong{font-size:15.5px;font-weight:800;white-space:nowrap;}
  .dc-cta{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:800;white-space:nowrap;}
  .dc-cta svg{width:15px;height:15px;}

  /* ============================= BUTON / FORM (ortak) ============================= */
  .btn{border:1px solid var(--glass-border);background:rgba(255,255,255,.05);color:var(--text);padding:10px 15px;border-radius:12px;
    font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:border-color .2s, background .2s, transform .2s var(--ease), filter .2s;}
  .btn:hover{border-color:rgba(212,175,55,.5);}
  .btn:active{transform:scale(.97);}
  .btn svg{width:15px;height:15px;}
  .btn-primary{background:linear-gradient(135deg,var(--gold-2),var(--gold) 60%,var(--gold-3));border-color:transparent;color:var(--gold-ink);font-weight:800;
    box-shadow:0 8px 22px rgba(212,175,55,.28);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-danger{color:var(--danger);}
  .btn-ghost{background:none;border-color:transparent;}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:10px;}
  .btn-block{width:100%;}
  .btn-lg{min-height:54px;font-size:15.5px;border-radius:16px;justify-content:space-between;padding:0 20px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;
    border:1px solid var(--glass-border);background:rgba(255,255,255,.05);flex:none;transition:border-color .2s;}
  .icon-btn svg{width:15px;height:15px;}
  .icon-btn:hover{border-color:rgba(212,175,55,.5);}
  .icon-btn[disabled]{opacity:.35;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:7px;}
  .field label em{color:var(--gold);font-style:normal;}
  .field input[type=text],.field input[type=number],.field input[type=tel],.field input[type=password],
  .field select,.field textarea{width:100%;padding:12px 13px;background:rgba(5,6,8,.5);border:1px solid var(--glass-border);
    border-radius:13px;font-size:16px;color:var(--text);outline:0;transition:border-color .2s, box-shadow .2s;resize:vertical;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(212,175,55,.6);box-shadow:0 0 0 4px rgba(212,175,55,.12);}
  .field input::placeholder,.field textarea::placeholder{color:var(--text-faint);}
  .field select option{background:#181A20;}
  .field.invalid input,.field.invalid textarea{border-color:var(--danger);box-shadow:0 0 0 4px var(--danger-soft);animation:shake .35s;}
  @keyframes shake{25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .hint{font-size:11.5px;color:var(--text-faint);margin-top:5px;}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;}
  .pill.ok{background:var(--ok-soft);color:var(--ok);}
  .pill.warn{background:var(--warn-soft);color:var(--warn);}
  .pill.road{background:var(--warm-soft);color:var(--warm);}
  .pill.danger{background:var(--danger-soft);color:var(--danger);}
  .pill.info{background:rgba(126,182,230,.16);color:var(--info);}

  /* ============================= SHEET / MODAL ============================= */
  .overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
    pointer-events:auto;touch-action:none;   /* modal açıkken arka sayfa dokunuşu almasın */
    background:rgba(2,3,4,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadein .22s ease both;}
  .dialog{position:relative;width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;
    pointer-events:auto;touch-action:pan-y;will-change:transform;
    background:rgba(18,20,24,.9);-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);
    border:1px solid var(--glass-border);border-bottom:0;border-radius:28px 28px 0 0;
    box-shadow:inset 0 1px 0 var(--glass-hi), 0 -24px 60px rgba(0,0,0,.5);animation:sheetup .38s var(--ease) both;}
  .dialog-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:22px 20px 12px;
    background:linear-gradient(rgba(18,20,24,.96),rgba(18,20,24,.88));}
  .dialog-head::before{content:'';position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:rgba(255,255,255,.18);}
  .dialog-head h3{margin:0;font-family:var(--font-display);font-weight:600;font-size:21px;}
  .dialog-body{padding:6px 20px 18px;}
  .dialog-foot{position:sticky;bottom:0;z-index:6;display:flex;justify-content:flex-end;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:14px 16px calc(14px + var(--safe-b));
    border-top:1px solid var(--glass-border);background:#121418;}
  .overlay.closing{animation:fadeout .2s ease forwards;}
  .overlay.closing .dialog{animation:sheetdown .22s ease forwards;}
  .overlay.closing.dragged .dialog{animation:none;}
  .dialog.dragging{transition:none !important;user-select:none;-webkit-user-select:none;}
  @keyframes fadein{from{opacity:0;}} @keyframes fadeout{to{opacity:0;}}
  @keyframes sheetup{from{transform:translateY(100%);}to{transform:none;}}
  @keyframes sheetdown{to{transform:translateY(40%);opacity:0;}}
  @media (min-width:640px){
    .overlay{align-items:center;padding:20px;}
    .dialog{border-radius:28px;border-bottom:1px solid var(--glass-border);animation:dialogin .32s var(--ease) both;}
    .dialog-head::before{display:none;} .dialog-head{padding-top:18px;}
    .dialog-foot{padding-bottom:14px;}
    @keyframes dialogin{from{opacity:0;transform:translateY(18px) scale(.97);}}
  }

  /* Sepet */
  .cart-line{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--glass-border);animation:rise .35s var(--ease) both;}
  .cart-line:last-child{border-bottom:0;}
  .cl-thumb{width:52px;height:52px;border-radius:14px;object-fit:cover;background:linear-gradient(145deg,#1E2128,#181A20);display:grid;place-items:center;color:rgba(212,175,55,.55);}
  .cl-thumb svg{width:24px;height:24px;}
  .cl-name{font-weight:800;font-size:14px;line-height:1.3;}
  .cl-price{font-size:12px;color:var(--text-faint);margin-top:3px;font-weight:600;}
  .cl-opts{font-size:12px;color:var(--gold-2);margin-top:4px;line-height:1.4;font-weight:600;}
  .cl-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .cl-total{font-weight:800;font-size:14px;color:var(--gold-2);}
  .cart-sum{margin:6px 0 4px;padding:14px 16px;border-radius:16px;background:rgba(5,6,8,.4);border:1px solid var(--glass-border);}
  .cart-sum div{display:flex;justify-content:space-between;font-size:13.5px;color:var(--text-dim);font-weight:600;}
  .cart-sum div + div{margin-top:8px;}
  .cart-sum .total{font-size:17px;color:var(--text);font-weight:800;padding-top:10px;border-top:1px dashed var(--glass-border);}
  .cart-sum .total span:last-child{color:var(--gold-2);}
  .form-title{font-family:var(--font-display);font-weight:600;font-size:17px;margin:20px 0 12px;}
  .notice.danger{background:rgba(232,112,93,.14);color:#FFB3A6;border:1px solid rgba(232,112,93,.45);}
  /* Yönetim: acil kapatma şeridi */
  .emg-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding:14px 16px;border-radius:18px;
    background:rgba(232,112,93,.08);border:1px solid rgba(232,112,93,.35);}
  .emg-bar.on{background:linear-gradient(135deg,rgba(232,112,93,.28),rgba(160,40,30,.22));border-color:rgba(232,112,93,.8);box-shadow:0 0 0 3px rgba(232,112,93,.15);}
  .emg-bar .emg-txt{flex:1;min-width:180px;}
  .emg-bar .emg-txt strong{display:block;font-size:14.5px;color:#FFB3A6;}
  .emg-bar .emg-txt small{display:block;margin-top:3px;font-size:12px;color:var(--text-dim);line-height:1.4;}
  .emg-bar.on .emg-txt small{color:#FFD4CC;}
  .emg-switch{flex:none;display:inline-flex;align-items:center;gap:9px;padding:4px 12px 4px 4px;border-radius:99px;font-weight:800;font-size:12.5px;
    border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:var(--text-dim);cursor:pointer;}
  .emg-switch .k{width:28px;height:28px;border-radius:50%;background:#5b5f66;transition:background .25s;}
  .emg-switch.on{flex-direction:row-reverse;padding:4px 4px 4px 12px;background:var(--danger);border-color:var(--danger);color:#fff;}
  .emg-switch.on .k{background:#fff;}
  .notice{margin-top:12px;padding:11px 14px;border-radius:13px;background:var(--warn-soft);color:var(--warn);font-size:12.8px;font-weight:600;line-height:1.45;}
  .btn-sub{font-weight:700;opacity:.8;font-size:14px;}

  /* ============================= KENDİ BOWL'UNU OLUŞTUR ============================= */
  .bowl-hero{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;margin-bottom:6px;}
  .bowl-hero img,.bowl-hero .ph{width:76px;height:76px;border-radius:18px;object-fit:cover;background:linear-gradient(145deg,#1E2128,#181A20);display:grid;place-items:center;color:rgba(212,175,55,.55);}
  .bowl-hero .ph svg{width:34px;height:34px;}
  .bowl-hero p{margin:0;font-size:13px;color:var(--text-dim);line-height:1.45;}
  .bowl-hero .price{display:block;margin-top:6px;}
  .opt-step{margin-top:18px;}
  .opt-title{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .opt-num{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;
    background:var(--gold-soft);color:var(--gold-2);border:1px solid rgba(212,175,55,.35);}
  .opt-title h4{margin:0;font-family:var(--font-display);font-weight:600;font-size:17px;}
  .opt-title small{display:block;font-size:12px;color:var(--text-faint);font-weight:600;margin-top:2px;}
  .opt-badge{margin-left:auto;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.06);color:var(--text-dim);white-space:nowrap;}
  .opt-badge.req{background:var(--warn-soft);color:var(--warn);}
  .opt-badge.ok{background:var(--ok-soft);color:var(--ok);}
  .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .opt{position:relative;display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 12px;border-radius:14px;cursor:pointer;
    background:rgba(5,6,8,.45);border:1px solid var(--glass-border);transition:border-color .2s, background .2s, transform .15s var(--ease);
    -webkit-user-select:none;user-select:none;}
  .opt:hover{border-color:rgba(212,175,55,.45);}
  .opt:active{transform:scale(.98);}
  .opt input{position:absolute;opacity:0;pointer-events:none;}
  .opt-mark{flex:none;width:20px;height:20px;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;transition:all .2s;}
  .opt.radio .opt-mark{border-radius:50%;} .opt.check .opt-mark{border-radius:6px;}
  .opt-name{font-size:13.2px;font-weight:700;line-height:1.25;}
  .opt.sel{border-color:var(--gold);background:linear-gradient(135deg,rgba(212,175,55,.18),rgba(212,175,55,.05));box-shadow:0 0 0 1px rgba(212,175,55,.25) inset;}
  .opt.sel .opt-mark{border-color:var(--gold);background:var(--gold);}
  .opt.radio.sel .opt-mark::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--gold-ink);}
  .opt.check.sel .opt-mark::after{content:'';width:9px;height:5px;border:2.5px solid var(--gold-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);}
  .opt.limit{opacity:.45;cursor:not-allowed;}
  .opt.sold{cursor:not-allowed;opacity:.5;background:rgba(5,6,8,.25);border-style:dashed;}
  .opt.sold .opt-name{text-decoration:line-through;text-decoration-color:var(--danger);color:var(--text-faint);}
  .opt-extra{margin-left:auto;padding:2px 7px;border-radius:99px;font-size:10.5px;font-weight:800;background:var(--gold-soft);color:var(--gold-2);border:1px solid rgba(212,175,55,.4);white-space:nowrap;}
  .opt.sel .opt-extra{background:var(--gold);color:#1A1405;border-color:var(--gold);}
  .bowl-sum{margin:6px 0 4px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--glass-border);font-size:13px;}
  .bowl-sum .bs-row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:var(--text-dim);}
  .bowl-sum .bs-row.x{color:var(--gold-2);font-weight:700;}
  .bowl-sum .bs-row.t{border-top:1px solid var(--glass-border);margin-top:6px;padding-top:8px;color:var(--text);font-weight:800;font-size:14px;}
  .opt-sold{margin-left:auto;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.04em;background:var(--danger-soft);color:var(--danger);white-space:nowrap;}
  .opt-empty{grid-column:1/-1;font-size:12.5px;color:var(--text-faint);padding:6px 2px;}
  .bowl-foot{flex:1;display:flex;gap:10px;align-items:center;width:100%;min-width:0;box-sizing:border-box;}
  .bowl-foot .stepper button{width:36px;height:40px;} .bowl-foot .stepper .q{min-width:24px;}
  .bowl-foot .btn-lg{flex:1;}
  @media (max-width:360px){ .opt-grid{grid-template-columns:1fr;} }

  /* ============================= STOK YÖNETİMİ (YÖNETİCİ) ============================= */
  .stock-list{display:flex;flex-direction:column;gap:8px;}
  .stock-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;background:var(--bg-elev);border:1px solid var(--glass-border);transition:opacity .2s, border-color .2s;}
  .stock-row.off{border-color:rgba(232,112,93,.35);}
  .stock-row.off .sr-name{color:var(--text-faint);text-decoration:line-through;text-decoration-color:rgba(232,112,93,.6);}
  .sr-info{flex:1;min-width:0;}
  .sr-name{font-weight:800;font-size:14px;}
  .sr-meta{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .switch{flex:none;display:inline-flex;align-items:center;gap:9px;padding:4px 12px 4px 4px;border-radius:99px;border:1px solid rgba(232,112,93,.4);
    background:var(--danger-soft);color:var(--danger);font-size:12px;font-weight:800;min-width:128px;transition:all .25s var(--ease);}
  .switch .sw-knob{width:26px;height:26px;border-radius:50%;background:var(--danger);box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .25s var(--ease), background .25s;}
  .switch.on{border-color:rgba(127,199,154,.45);background:var(--ok-soft);color:var(--ok);flex-direction:row-reverse;padding:4px 4px 4px 12px;}
  .switch.on .sw-knob{background:var(--ok);}
  .switch .sw-label{flex:1;text-align:center;}
  .stock-add{display:flex;gap:8px;margin-top:12px;}
  .stock-add input{flex:1;min-width:0;padding:10px 12px;background:rgba(5,6,8,.5);border:1px solid var(--glass-border);border-radius:12px;font-size:15px;color:var(--text);outline:0;}
  .stock-add input:focus{border-color:rgba(212,175,55,.6);}
  .stock-sum{font-size:12px;font-weight:700;color:var(--text-faint);}
  .chk{display:flex!important;align-items:center;gap:10px;font-size:13.5px!important;color:var(--text)!important;cursor:pointer;}
  .chk input{width:18px;height:18px;accent-color:var(--gold);}
  .adm-items{display:flex;flex-direction:column;gap:6px;}
  .adm-item strong{font-size:14.5px;}
  .adm-opts{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
  .adm-tag{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(255,255,255,.06);border:1px solid var(--glass-border);color:var(--text-dim);}
  .adm-tag.base{background:rgba(255,255,255,.08);border-color:rgba(230,202,101,.45);color:var(--text);}
  .adm-tag.meze{background:rgba(255,255,255,.08);border-color:rgba(230,202,101,.35);color:var(--text);}
  .adm-tag.extra{background:var(--gold);border-color:var(--gold);color:#1A1405;}
  .adm-tag.sos{background:var(--gold-soft);border-color:rgba(212,175,55,.45);color:var(--gold-2);}

  /* ============================= ÜRÜN DETAY MODALI ============================= */
  .item{cursor:pointer;}
  .dialog.detail .dialog-head{position:absolute;left:0;right:0;top:0;background:none;padding:14px 14px 0;justify-content:flex-end;z-index:5;}
  .dialog.detail .dialog-head h3{display:none;}
  .dialog.detail .dialog-head::before{z-index:6;background:rgba(255,255,255,.5);}
  .dialog.detail .dialog-head .icon-btn{background:rgba(11,12,14,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-color:rgba(212,175,55,.4);}
  .dialog.detail .dialog-body{padding:0 0 6px;}
  .dt-media{position:relative;width:100%;aspect-ratio:4/3;max-height:52vh;overflow:hidden;background:radial-gradient(circle at 35% 30%, rgba(212,175,55,.22), transparent 60%), linear-gradient(145deg,#1E2128,#181A20);}
  .dt-media img{width:100%;height:100%;object-fit:cover;display:block;animation:dtzoom 1.2s var(--ease) both;}
  @keyframes dtzoom{from{transform:scale(1.08);opacity:.4;}to{transform:none;opacity:1;}}
  .dt-media .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(212,175,55,.5);}
  .dt-media .ph svg{width:30%;height:30%;}
  .dt-media::after{content:'';position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent, rgba(15,17,21,.95));pointer-events:none;}
  .dt-media .badge{top:16px;left:16px;font-size:11.5px;padding:5px 11px;}
  .dt-media .sold{z-index:1;}
  #dt-add[disabled]{background:rgba(255,255,255,.07);color:var(--text-faint);box-shadow:none;}
  .dt-body{position:relative;margin-top:-34px;padding:0 20px 8px;z-index:4;}
  .dt-name{font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.15;margin:0;letter-spacing:-.01em;}
  .dt-price{display:inline-block;margin-top:8px;font-weight:800;font-size:22px;color:var(--gold-2);}
  .dt-desc{margin:14px 0 0;font-size:14.5px;line-height:1.65;color:var(--text-dim);white-space:pre-line;}
  .dt-desc.empty{color:var(--text-faint);font-style:italic;}
  .dt-note{margin-top:14px;padding:11px 13px;border-radius:13px;background:var(--gold-soft);border:1px solid rgba(212,175,55,.35);font-size:12.8px;color:var(--gold-2);font-weight:600;line-height:1.45;}
  .dt-note.off{background:var(--danger-soft);border-color:rgba(232,112,93,.4);color:var(--danger);}
  .dt-foot{flex:1;display:flex;gap:10px;align-items:center;width:100%;min-width:0;box-sizing:border-box;}
  .dt-foot .stepper button{width:36px;height:40px;} .dt-foot .stepper .q{min-width:24px;}
  .dt-foot .btn-lg{flex:1;}
  /* sabit genişlikli adet seçici + esneyen buton: dar ekranda da taşmaz */
  .dt-foot .stepper,.bowl-foot .stepper{flex:none;min-width:105px;justify-content:space-between;box-sizing:border-box;}
  .dt-foot .btn-lg,.bowl-foot .btn-lg{flex:1;min-width:0;gap:8px;padding:0 16px;box-sizing:border-box;}
  .dt-foot .btn-lg > span:first-child,.bowl-foot .btn-lg > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;}
  .dt-foot .btn-sub,.bowl-foot .btn-sub{flex:none;}
  @media (max-width:370px){
    .dialog-foot{gap:8px;padding-left:12px;padding-right:12px;}
    .dt-foot,.bowl-foot{gap:8px;}
    .dt-foot .btn-lg,.bowl-foot .btn-lg{padding:0 12px;font-size:14px;}
    .dt-foot .btn-sub,.bowl-foot .btn-sub{font-size:13px;}
  }
  /* yönetim: görsel kaldır */
  .photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .btn-remove{color:var(--danger);border-color:rgba(232,112,93,.45);background:var(--danger-soft);}
  .btn-remove:hover{border-color:var(--danger);}
  .photo-empty{display:grid;place-items:center;height:120px;border-radius:13px;margin-bottom:10px;background:var(--bg-elev);border:1px dashed var(--glass-border);color:var(--text-faint);font-size:12.5px;}

  /* mutfak bildirimleri */

  .cp-rule::after{transform:scaleX(-1);}

  .tel-link{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:5px 12px;border-radius:99px;text-decoration:none;font-weight:800;font-size:13.5px;
    background:var(--gold-soft);border:1px solid rgba(212,175,55,.5);color:var(--gold-2);font-variant-numeric:tabular-nums;}
  .tel-link:hover{background:rgba(212,175,55,.24);}

  /* ============================= CANLI SİPARİŞ TAKİBİ ============================= */
  .track{text-align:center;padding-top:4px;}

  .tv-ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle, rgba(212,175,55,.35), transparent 68%);animation:ringpulse 2.2s ease-in-out infinite;}
  .tv-ring::after{content:'';position:absolute;inset:6px;border-radius:50%;border:2px dashed rgba(212,175,55,.4);animation:spin 14s linear infinite;}
  .tv-icon{position:absolute;inset:18px;border-radius:50%;display:grid;place-items:center;color:var(--gold-ink);
    background:linear-gradient(145deg,var(--gold-2),var(--gold) 60%,var(--gold-3));box-shadow:0 12px 30px rgba(212,175,55,.4);}
  .tv-icon svg{width:32px;height:32px;}
  .state-hazirlaniyor .tv-icon svg{animation:cook 1.4s ease-in-out infinite;}
  .state-hazirlaniyor .tv-ring::after{animation-duration:4s;}
  .state-yolda .tv-icon svg{animation:ride .9s ease-in-out infinite;}
  .state-yolda .tv-ring::after{animation-duration:2.5s;}
  @keyframes ride{0%,100%{transform:translateX(-2px);}50%{transform:translateX(2px) translateY(-1px);}}
  .steps li{text-align:center;}
  .state-tamamlandi .tv-ring{background:radial-gradient(circle, rgba(127,199,154,.38), transparent 68%);animation:none;}
  .state-tamamlandi .tv-ring::after{border-color:rgba(127,199,154,.5);animation:none;border-style:solid;}
  .state-tamamlandi .tv-icon{background:linear-gradient(145deg,#A9E2BD,var(--ok));color:#0B2416;box-shadow:0 12px 30px rgba(127,199,154,.4);animation:pop .5s var(--ease);}
  .state-tamamlandi .tv-icon path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .15s ease forwards;}
  .state-iptal .tv-ring,.state-kayip .tv-ring{background:radial-gradient(circle, rgba(232,112,93,.3), transparent 68%);animation:none;}
  .state-iptal .tv-ring::after,.state-kayip .tv-ring::after{border-color:rgba(232,112,93,.4);animation:none;}
  .state-iptal .tv-icon,.state-kayip .tv-icon{background:linear-gradient(145deg,#F3A090,var(--danger));color:#2A0B06;box-shadow:0 12px 30px rgba(232,112,93,.35);}
  @keyframes ringpulse{50%{transform:scale(1.08);opacity:.75;}}

  @keyframes cook{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg) translateY(-2px);}}
  @keyframes draw{to{stroke-dashoffset:0;}}
  .track-title{font-family:var(--font-display);font-weight:600;font-size:25px;margin:0;letter-spacing:-.01em;}
  .track-text{color:var(--text-dim);font-size:14px;line-height:1.5;margin:8px auto 0;max-width:340px;}
  .track-meta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 14px;margin-top:14px;font-size:12.5px;color:var(--text-faint);font-weight:700;}

  .steps li.active .st-dot{border-color:var(--gold);color:var(--gold-2);animation:activepulse 1.8s infinite;}
  @keyframes activepulse{0%{box-shadow:0 0 0 0 rgba(212,175,55,.45);}70%{box-shadow:0 0 0 10px rgba(212,175,55,0);}100%{box-shadow:0 0 0 0 rgba(212,175,55,0);}}

  #toast-root{position:fixed;right:20px;bottom:24px;z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none;}

  }

function fmtMoney(n, cur){ return (Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ' + (cur||'₺'); }
function fmtPrice(n){ const v = Number(n)||0; return v.toLocaleString('tr-TR',{minimumFractionDigits: v%1?2:0, maximumFractionDigits:2}) + ' ' + (state.settings.currency||'₺'); }

function defaultData(){

/* Bowl malzemeleri — Firebase: qrmenu_data/options */
const DEFAULT_CHICKEN = ['BBQ Soslu Tavuk','Sweet Chili Soslu','Hot Chili Soslu','Köri Soslu','Soya Soslu','Kremalı Çeşnili','Kremalı Mantarlı','Marineli Izgara'];
const DEFAULT_GARNISH = ['Mısır','Salatalık Turşusu','Jalapeno Turşusu','Bezelye','Cherry Domates','Salatalık','Siyah Zeytin','Haşlanmış Nohut'];
const DEFAULT_BASE = ['Tereyağlı Pilav','İtalyan Makarna','Taze Yeşillik / Akdeniz Salata'];
const DEFAULT_MEZE = ['Haydari','Şakşuka','Atom','Humus'];
const OPT_PREFIX = { base:'bs', chicken:'ch', garnish:'gr', meze:'mz' };
const PRICE_DEFAULTS = { freeGarnish:3, extraGarnishPrice:10, freeMeze:1, extraMezePrice:15 };
const mkOpts = (p, list) => list.map((name,i)=>({ id: p+'_'+(i+1), name, available:true }));
function defaultOptions(){
  return Object.assign({ maxGarnish:6, base: mkOpts('bs', DEFAULT_BASE), chicken: mkOpts('ch', DEFAULT_CHICKEN), garnish: mkOpts('gr', DEFAULT_GARNISH), meze: mkOpts('mz', DEFAULT_MEZE) }, PRICE_DEFAULTS);
}
function normOptions(v){
  if(!v) return defaultOptions();
  return { maxGarnish: Math.max(1, Math.min(8, Number(v.maxGarnish)||4)),
    base: v.base ? toList(v.base) : mkOpts('bs', DEFAULT_BASE),   // eski veritabanında yoksa varsayılan tabanlar
    chicken: toList(v.chicken), garnish: toList(v.garnish),
    // meze listesi: hiç kurulmamış eski veritabanında varsayılanlar; yönetici hepsini sildiyse boş kalır
    meze: v.meze ? toList(v.meze) : (v.extraMezePrice!=null ? [] : mkOpts('mz', DEFAULT_MEZE)),
    freeGarnish: numOr(v.freeGarnish, PRICE_DEFAULTS.freeGarnish), extraGarnishPrice: numOr(v.extraGarnishPrice, PRICE_DEFAULTS.extraGarnishPrice),
    freeMeze: numOr(v.freeMeze, PRICE_DEFAULTS.freeMeze), extraMezePrice: numOr(v.extraMezePrice, PRICE_DEFAULTS.extraMezePrice) };
}
function numOr(x, d){ const n = Number(x); return (x===undefined || x===null || x==='' || !isFinite(n) || n<0) ? d : n; }
/* Dinamik ekstra ücret: ücretsiz kotayı aşan her garnitür / meze için ek tutar */
function bowlExtras(nG, nM){
  const o = state.options || {};
  const paidG = Math.max(0, nG - numOr(o.freeGarnish, PRICE_DEFAULTS.freeGarnish));
  const paidM = Math.max(0, nM - numOr(o.freeMeze, PRICE_DEFAULTS.freeMeze));
  const extraGarnish = paidG * numOr(o.extraGarnishPrice, PRICE_DEFAULTS.extraGarnishPrice);
  const extraMeze = paidM * numOr(o.extraMezePrice, PRICE_DEFAULTS.extraMezePrice);
  return { paidG, paidM, extraGarnish, extraMeze, extra: extraGarnish + extraMeze };
}
function baseIcon(name){ const n = trLower(name); return /makarna|penne|pasta/.test(n) ? '🍝' : /yeşil|salata|akdeniz/.test(n) ? '🥗' : '🍚'; }
function optById(group, id){ return ((state.options||{})[group]||[]).find(o=>o.id===id); }
function isBowl(it){ if(!it) return false; if(typeof it.isBowl==='boolean') return it.isBowl; return /bowl/i.test(it.name||''); }
function optsText(o){
  if(!o) return '';
  const g = toList(o.garnish);
  const m = toList(o.meze), xg = Number(o.extraGarnish)||0, xm = Number(o.extraMeze)||0;
  return [o.base? baseIcon(o.base)+' Taban: '+o.base : '', o.chicken? 'Sos: '+o.chicken : '',
    g.length? 'Garnitür: '+g.join(', ')+(xg? ' (+'+fmtPrice(xg)+' Ekstra)' : '') : '',
    m.length? '🧆 Meze: '+m.join(', ')+(xm? ' (+'+fmtPrice(xm)+' Ekstra)' : '') : ''].filter(Boolean).join(' · ');
}
/* Sepet satır anahtarı: aynı Bowl farklı seçimlerle ayrı satır olur */
function lineKey(itemId, o){ return o ? itemId+'|'+(o.baseId? o.baseId+'|' : '')+(o.chickenId||'')+'|'+(o.garnishIds||[]).slice().sort().join(',')+((o.mezeIds||[]).length? '|'+o.mezeIds.slice().sort().join(',') : '') : itemId; }
function lineItemId(key, c){ return (c && c.itemId) || String(key).split('|')[0]; }
function qtyInCart(itemId){ return Object.entries(cart).reduce((s,[k,c])=> s + (lineItemId(k,c)===itemId ? c.qty : 0), 0); }

function mapsLink(){
  const s = state.settings;
  if(/^https:\/\//i.test(s.mapsUrl||'')) return s.mapsUrl;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.location||'');
}
/* "11:00 - 22:00" biçimindeki saatten açık/kapalı durumu (gece yarısını geçen saatler dahil) */
function openStatus(h){
  const m = String(h||'').match(/(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})/);
  if(!m) return null;
  const now = new Date(), cur = now.getHours()*60 + now.getMinutes();
  const a = (+m[1])*60 + (+m[2]), b = (+m[3])*60 + (+m[4]);
  const open = a<=b ? (cur>=a && cur<b) : (cur>=a || cur<b);
  return { open, openAt: m[1].padStart(2,'0')+':'+m[2], closeAt: m[3].padStart(2,'0')+':'+m[4] };
}

/* ============================= FIREBASE =============================
   Müşteri cihazı sadece settings / categories / items okur (başkalarının
   sipariş ve adres bilgileri müşteri telefonlarına inmez). Siparişler
   yalnızca yönetici PIN ile girince yüklenir. Veritabanı yapısı aynıdır. */
let fbRef = null, suppressPush=false;
const PUBLIC_KEYS = ['settings','categories','items','options'];
function firebaseConfigured(){
  return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('BURAYA_YAPISTIR')===-1;
}
function initFirebase(){
  if(!firebaseConfigured()){ renderSetupError(); return; }
  if(typeof firebase==='undefined' || window.__fbLoadFailed){
    renderSetupError('Firebase kütüphanesi yüklenemedi. Muhtemel nedenler: internet bağlantınız yok, bir reklam engelleyici / güvenlik yazılımı gstatic.com adresini engelliyor, ya da dosyayı "file://" olarak yerelden açtınız. Lütfen internete bağlıyken, reklam engelleyiciyi kapatıp, dosyayı bir web sunucusundan (GitHub Pages gibi) açarak tekrar deneyin.');
    return;
  }
  try{
    const app = firebase.apps.length? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
    fbRef = app.database().ref(DB_PATH);
    const loaded = {}; let settingsMissing = false, optionsMissing = false, baseMissing = false, mezeMissing = false;
    PUBLIC_KEYS.forEach(k=>{
      fbRef.child(k).on('value', snap=>{
        const v = snap.val();
        if(k==='settings'){
          if(!v && !loaded.settings) settingsMissing = true;
          state.settings = Object.assign(defaultData().settings, v||{});
        } else if(k==='options'){
          if(!v && !loaded.options) optionsMissing = true;
          if(v && !loaded.options && !v.base) baseMissing = true;
          if(v && !loaded.options && v.extraMezePrice==null) mezeMissing = true;
          state.options = normOptions(v);
        } else {
          state[k] = toList(v);
        }
        if(k==='items' || k==='options'){
          const removed = sanitizeCart();
          if(removed.length && dataLoaded && view==='menu') showToast('Tükendi, sepetinizden çıkarıldı: ' + removed.join(', '));
        }
        loaded[k] = true;
        if(!PUBLIC_KEYS.every(x=>loaded[x])) return;
        const first = !dataLoaded;
        dataLoaded = true;
        if(first){
          if(settingsMissing) saveState();        // boş veritabanı: varsayılanları yaz
          else if(optionsMissing) fbRef.child('options').set(state.options);   // Bowl malzemelerini ilk kez oluştur
          else {
            if(baseMissing) fbRef.child('options').child('base').set(state.options.base);   // Taban çeşitlerini ilk kez ekle
            if(mezeMissing){   // Meze çeşitleri + ekstra ücretleri ilk kez ekle (garnitür sınırı ücretli seçime yer açsın)
              const o = state.options; if(o.maxGarnish <= o.freeGarnish + 1) o.maxGarnish = 6;
              fbRef.child('options').update({ meze:o.meze, maxGarnish:o.maxGarnish, freeGarnish:o.freeGarnish, extraGarnishPrice:o.extraGarnishPrice, freeMeze:o.freeMeze, extraMezePrice:o.extraMezePrice });
            }
          }
          startTracking();
        }
        render();
        if(first) setTimeout(()=> location.hash==='#mutfak' ? openAdminLogin() : startWelcomeFlow(), 400);
      }, err=>{ renderSetupError('Bağlantı hatası: '+err.message); });
    });
  }catch(e){ renderSetupError('Config geçersiz görünüyor: '+e.message); }
}
function saveState(){
  if(fbRef && !suppressPush){
    // orders burada YAZILMAZ: siparişler 'orders/<id>' altında kalır, menü/ayar kaydı sipariş verisini ezmez.
    const copy = Object.assign({}, state); delete copy.orders;
    fbRef.update(copy).catch(e=>showToast('Kaydetme hatası: '+e.message));
  }
}
function pushOrder(order){
  if(!fbRef){ showToast('Bağlantı yok, sipariş iletilemedi. Lütfen internetinizi kontrol edip tekrar deneyin.'); return false; }
  fbRef.child('orders').child(order.id).set(order).catch(e=>{ console.error(e); showToast('Sipariş iletilemedi: '+e.message); });
  return true;
}
/* Firebase siparişleri id anahtarlı nesne döndürür; her iki biçimi de güvenle okuyan yardımcı */
function getOrders(){
  return Object.values(state.orders || {}).filter(Boolean);
}
function updateOrderStatus(id, status){
  if(!fbRef) return;
  fbRef.child('orders').child(id).child('status').set(status);
  const o = getOrders().find(x=>x.id===id); if(o) o.status = status;
}
/* Menüde artık olmayan / tükenen ürün ve malzemeleri sepetten düş, fiyatları güncelle.
   Çıkarılanların adlarını döndürür. */
function sanitizeCart(){
  let changed = false; const removed = [];
  Object.keys(cart).forEach(key=>{
    const c = cart[key], it = state.items.find(x=>x.id===lineItemId(key,c));
    if(!it || it.available===false){ removed.push(c.name); delete cart[key]; changed = true; return; }
    if(c.options){
      const ch = optById('chicken', c.options.chickenId);
      const bs = c.options.baseId ? optById('base', c.options.baseId) : true, badB = !bs || bs.available===false;
      const badG = (c.options.garnishIds||[]).map(id=>optById('garnish', id)).filter(g=>!g || g.available===false);
      const badM = (c.options.mezeIds||[]).map(id=>optById('meze', id)).filter(g=>!g || g.available===false);
      if(badB || !ch || ch.available===false || badG.length || badM.length){
        removed.push(c.name + ' (' + [badB? c.options.base : '', (!ch||ch.available===false)? c.options.chicken : '', ...badG.map(g=>g? g.name : 'malzeme'), ...badM.map(g=>g? g.name : 'meze')].filter(Boolean).join(', ') + ')');
        delete cart[key]; changed = true; return;
      }
      // ekstra ücretler güncel fiyatlarla yeniden hesaplanır (yönetici ücreti değiştirirse sepet de güncellenir)
      const x = bowlExtras((c.options.garnishIds||[]).length, (c.options.mezeIds||[]).length);
      if(c.options.extra!==x.extra || c.options.extraGarnish!==x.extraGarnish || c.options.extraMeze!==x.extraMeze){
        c.options.extraGarnish = x.extraGarnish; c.options.extraMeze = x.extraMeze; c.options.extra = x.extra; changed = true;
      }
    }
    const unit = it.price + (c.options ? (Number(c.options.extra)||0) : 0);
    if(c.price!==unit || c.name!==it.name){ c.price = unit; c.name = it.name; changed = true; }
  });
  if(changed) saveCart();
  return removed;
}

/* ============================= SİPARİŞ AKIŞI (YÖNETİCİ): CANLI DİNLEME · SES · BEKLEME SAYACI ============================= */
let adminAuthed = false;
let audioCtx = null;
let soundEnabled = localStorage.getItem('qrmenu_sound_v1') !== 'off';
let ordersListening = false;
let ordersInitialDone = false;
const freshOrderIds = new Set();

function unlockAudio(){
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const buf = audioCtx.createBuffer(1,1,22050);
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.connect(audioCtx.destination); src.start(0);
  }catch(e){}
}
function playTone(freq, start, dur, vol){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(vol, start+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, start+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(start); o.stop(start+dur+0.05);
}
function playOrderSound(force){
  if(!soundEnabled && !force) return;
  if(!audioCtx){ showToast('Ses için ekrana bir kez dokunun'); return; }
  const go = ()=>{
    const t = audioCtx.currentTime;
    for(let i=0;i<3;i++){
      playTone(880,    t + i*0.6,        0.45, 0.35);
      playTone(1318.5, t + i*0.6 + 0.18, 0.45, 0.30);
    }
  };
  if(audioCtx.state === 'running') go();
  else audioCtx.resume().then(()=>{ if(audioCtx.state==='running') go(); else showToast('Ses için ekrana bir kez dokunun'); }).catch(()=>{});
}
document.addEventListener('pointerdown', ()=>{ if(adminAuthed) unlockAudio(); }, {passive:true});

function waitMinutes(iso){ return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime())/60000)); }
function waitText(iso){
  const mins = waitMinutes(iso);
  if(mins < 1) return 'Az önce';
  if(mins < 60) return mins + ' dk önce';
  const h = Math.floor(mins/60), m = mins % 60;
  if(h < 24) return h + ' sa' + (m ? ' ' + m + ' dk' : '') + ' önce';
  return Math.floor(h/24) + ' gün önce';
}
function waitClass(iso){
  const mins = waitMinutes(iso);
  return mins >= 20 ? 'wait-late' : mins >= 10 ? 'wait-warn' : 'wait-ok';
}
function updateWaitBadges(){
  document.querySelectorAll('.wait-badge[data-since]').forEach(el=>{
    el.textContent = '⏱ ' + waitText(el.dataset.since);
    el.className = 'wait-badge ' + waitClass(el.dataset.since);
  });
}
setInterval(()=>{
  updateWaitBadges();
  const ago = document.getElementById('track-ago'); const a = getActiveOrder();
  if(ago && a) ago.textContent = waitText(a.createdAt);
  if(view==='menu' && dataLoaded) updateHero();
}, 30000);

/* Siparişler sekmesi: sadece "Siparişler" açıksa tam yeniden çiz (Ayarlar formunda yazılanlar silinmesin) */
function refreshAdminOrdersUI(){
  if(view!=='admin') return;
  if(adminTab==='orders'){ render(); return; }
  const tab = document.querySelector('[data-atab="orders"]');
  if(tab){ const n = getOrders().filter(o=>o.status==='yeni').length; tab.innerHTML = 'Siparişler' + (n? `<span class="tab-count">${n}</span>`:''); }
}
function startOrdersListener(){
  if(ordersListening || !fbRef) return;
  ordersListening = true;
  const ref = fbRef.child('orders');
  ref.on('value', snap=>{                       // tüm siparişler — güvenli dizi dönüşümü
    state.orders = toList(snap.val());
    refreshAdminOrdersUI();
  }, err=>{ showToast('Siparişler okunamadı: ' + err.message); });
  ref.on('child_added', snap=>{
    if(!ordersInitialDone) return;              // açılıştaki mevcut siparişler için ses çalma
    const o = snap.val(); if(!o) return;
    if(!getOrders().some(x=>x.id===o.id)){
      if(!Array.isArray(state.orders)) state.orders = toList(state.orders);
      state.orders.push(o);
    }
    freshOrderIds.add(o.id);
    setTimeout(()=>{
      freshOrderIds.delete(o.id);
      const row = document.querySelector('[data-order-row="'+o.id+'"]');
      if(row) row.classList.remove('order-fresh');
    }, 4000);
    playOrderSound();
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    showToast('🛎 Yeni sipariş: ' + fmtMoney(o.total, state.settings.currency));
    if(document.hidden) localNotify('🔔 Yeni Sipariş Alındı! - RiceMore', `Müşteri: ${o.customerName||'—'} | Tutar: ${fmtMoney(o.total, state.settings.currency)} - Detaylar için tıklayın.`, 'order-'+o.id, kitchenLink());
    refreshAdminOrdersUI();

let modalToken = 0;
function openModal(title, bodyHtml, footHtml, cls){
  modalToken++;
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="overlay" id="modal-overlay"><div class="dialog ${cls||''}" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}">

  </div></div>`;
  document.getElementById('modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });
  document.getElementById('modal-close').addEventListener('click', closeModal);
  enableSwipeClose(document.querySelector('#modal-overlay .dialog'));
  document.removeEventListener('keydown', escHandler);
  document.addEventListener('keydown', escHandler);
}
function escHandler(e){ if(e.key==='Escape') closeModal(); }
/* iPhone tarzı: pencereyi aşağı sürükleyince kapat (tutamaktan / başlıktan ya da içerik en üstteyken) */
function enableSwipeClose(dlg){
  if(!dlg) return;
  const ov = dlg.parentElement;
  let sx=0, sy=0, st=0, lastY=0, lastT=0, vel=0, fromHead=false, track=false, dragging=false, dy=0;
  const reset = ()=>{ track=false; dragging=false; dy=0; };
  dlg.addEventListener('touchstart', e=>{
    if(e.touches.length!==1 || ov.classList.contains('closing')){ track=false; return; }
    const t = e.target;
    if(t.closest('textarea,select,input[type=range],[contenteditable]')){ track=false; return; }
    const head = t.closest('.dialog-head');
    fromHead = !!head && !t.closest('button,a,input');
    // başlık dışından başlarsa yalnızca içerik en üstteyken sürükleme kabul edilir
    track = fromHead || dlg.scrollTop<=0;
    sx = e.touches[0].clientX; sy = lastY = e.touches[0].clientY; st = lastT = performance.now(); vel = 0; dragging=false; dy=0;
  }, {passive:true});
  dlg.addEventListener('touchmove', e=>{
    if(!track) return;
    const x = e.touches[0].clientX, y = e.touches[0].clientY, now = performance.now();
    const dx = x - sx; dy = y - sy;
    if(!dragging){
      if(Math.abs(dx) > Math.abs(dy) + 4){ track=false; return; }          // yatay hareket: dokunma
      if(dy < 0 || (!fromHead && dlg.scrollTop > 0)){ track=false; return; }   // yukarı: normal kaydırma
      if(e.cancelable) e.preventDefault();                                // iOS esneme/kaydırma başlamasın
      if(dy < 6) return;
      dragging = true; dlg.classList.add('dragging'); dlg.style.animation = 'none';
    }
    if(e.cancelable) e.preventDefault();
    const d = Math.max(0, dy);
    dlg.style.transform = 'translateY('+d+'px)';
    ov.style.backgroundColor = 'rgba(2,3,4,'+(0.55*Math.max(0, 1 - d/(dlg.offsetHeight||600))).toFixed(3)+')';
    const dt = now - lastT; if(dt>0) vel = 0.8*((y - lastY)/dt) + 0.2*vel;   // px/ms
    lastY = y; lastT = now;
  }, {passive:false});
  const end = ()=>{
    if(!dragging){ reset(); return; }
    dlg.classList.remove('dragging');
    const d = Math.max(0, dy);
    if(d > 100 || (vel > 0.5 && d > 24)){
      // akıcı kapanış: parmağın bıraktığı yerden aşağı kayarak
      ov.classList.add('dragged');
      dlg.style.transition = 'transform .24s cubic-bezier(.2,.7,.3,1)';
      dlg.style.transform = 'translateY('+(dlg.offsetHeight + 40)+'px)';
      ov.style.transition = 'background-color .24s ease'; ov.style.backgroundColor = 'rgba(2,3,4,0)';
      closeModal();
    } else {
      // yetersiz çekiş: yumuşakça eski yerine
      dlg.style.transition = 'transform .32s cubic-bezier(.2,.9,.3,1.15)';
      dlg.style.transform = 'translateY(0)';
      ov.style.transition = 'background-color .32s ease'; ov.style.backgroundColor = '';
      setTimeout(()=>{ if(!dlg.classList.contains('dragging')){ dlg.style.transition=''; dlg.style.transform=''; ov.style.transition=''; } }, 340);
    }
    reset();
  };
  dlg.addEventListener('touchend', end);
  dlg.addEventListener('touchcancel', end);
}
function closeModal(){
  const root = document.getElementById('modal-root');
  const ov = document.getElementById('modal-overlay');
  document.removeEventListener('keydown', escHandler);
  if(!ov){ root.innerHTML=''; return; }
  const token = ++modalToken;
  ov.classList.add('closing');
  setTimeout(()=>{ if(token===modalToken) root.innerHTML=''; }, 210);
}

/* ============================= FOTOĞRAF KÜÇÜLTME ============================= */
function resizeImageFile(file, maxW){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function updateList(){
  const box = document.getElementById('menu-list'); if(!box) return;
  const q = trLower(searchQuery.trim());
  const cats = sortedCats();
  const items = state.items.filter(it=>{
    if(selectedCategoryId && it.categoryId!==selectedCategoryId) return false;
    if(q && !trLower(it.name).includes(q) && !trLower(it.description).includes(q)) return false;
    return true;
  });
  let i = 0;
  const empty = (title, text)=>`<div class="empty"><div class="em-ico">${ICONS.bowl}</div><div class="big">${title}</div>${text}</div>`;
  if(!state.items.length){ box.innerHTML = empty('Menümüz hazırlanıyor','Çok yakında lezzetlerimizle buradayız.'); return; }
  if(!items.length){ box.innerHTML = empty('Sonuç bulunamadı', q? `"${escapeHtml(searchQuery.trim())}" için ürün yok. Farklı bir arama deneyin.` : 'Bu kategoride henüz ürün yok.'); return; }
  if(selectedCategoryId || q){
    const title = q ? 'Arama sonuçları' : (cats.find(c=>c.id===selectedCategoryId)||{}).name || 'Ürünler';
    box.innerHTML = `<div class="sec-head"><h2>${escapeHtml(title)}</h2><span>${items.length} ürün</span></div><div class="items">${items.map(it=>itemCard(it, i++)).join('')}</div>`;
    return;
  }
  const sections = cats.map(cat=>{
    const list = items.filter(it=>it.categoryId===cat.id);
    if(!list.length) return '';
    return `<section><div class="sec-head"><h2>${escapeHtml(cat.name)}</h2><span>${list.length} ürün</span></div><div class="items">${list.map(it=>itemCard(it, i++)).join('')}</div></section>`;
  });
  const other = items.filter(it=>!cats.some(c=>c.id===it.categoryId));
  if(other.length) sections.push(`<section><div class="sec-head"><h2>Diğer</h2><span>${other.length} ürün</span></div><div class="items">${other.map(it=>itemCard(it, i++)).join('')}</div></section>`);
  box.innerHTML = sections.join('');
}

function decFromCart(itemId){
  if(!cart[itemId]) return;

}

  const c = cart[key]; if(!c) return;
