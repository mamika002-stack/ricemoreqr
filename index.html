      ${!sold && isEmergencyClosed()? `<div class="notice danger">🚨 ${EMERGENCY_MSG}</div>`
        : sold? `<div class="dt-note off">Bu ürün şu an tükendi. Kısa süre içinde tekrar stokta olacak.</div>`
            : bowl? `<div class="dt-note">✦ Bu bir Bowl: bir sonraki adımda tabanını, tavuk çeşidini, garnitürlerini (ilk ${numOr(state.options.freeGarnish,3)} ücretsiz) ve mezeni (ilk ${numOr(state.options.freeMeze,1)} ücretsiz) seçeceksin.</div>` : ''}
    </div>`;
  renderDetailFoot();
}
function renderDetailFoot(){
  const it = detailSel && state.items.find(x=>x.id===detailSel.itemId); if(!it) return;
  const sold = it.available===false, bowl = isBowl(it);
  const q = document.getElementById('dt-qty'); if(q) q.textContent = detailSel.qty;
  const off = sold || isEmergencyClosed();
  const st = document.getElementById('dt-stepper'); if(st) st.style.display = off ? 'none' : '';
  const b = document.getElementById('dt-add'), l = document.getElementById('dt-add-label'), t = document.getElementById('dt-total');
  if(b) b.disabled = off;
  if(l) l.textContent = sold ? 'Tükendi' : off ? 'Şu an Sipariş Alamıyoruz' : bowl ? "Kendi Bowl'unu Oluştur ›" : 'Sepete Ekle';
  if(t) t.textContent = off ? '' : fmtPrice(it.price * detailSel.qty);
}
function detailAdd(){
  const it = state.items.find(x=>x.id===detailSel.itemId);
  if(!it || it.available===false){ showToast('Bu ürün şu an tükendi'); renderDetail(); return; }
  if(isEmergencyClosed()){ showToast(EMERGENCY_MSG); renderDetail(); return; }
  const qty = detailSel.qty;
  if(isBowl(it)){ closeModal(); setTimeout(()=>openBowlModal(it.id, qty), 230); return; }   // Bowl → seçim adımları
  if(!cart[it.id]) cart[it.id] = { qty:0, price:it.price, name:it.name };
  cart[it.id].qty += qty;
  saveCart(); updateItemControl(it.id); updateDock(true);
  closeModal(); detailSel = null;
  showToast(`${qty} × ${it.name} sepete eklendi`, 'success');
}

/* ============================= KENDİ BOWL'UNU OLUŞTUR ============================= */
let bowlSel = null;   // { itemId, baseId, chickenId, garnish:[ids], qty }
function openBowlModal(itemId, initQty){
  const it = state.items.find(x=>x.id===itemId);
  if(!it || it.available===false){ showToast('Bu ürün şu an tükendi'); return; }
  if(isEmergencyClosed()){ showToast(EMERGENCY_MSG); return; }
  bowlSel = { itemId, baseId:'', chickenId:'', garnish:[], meze:[], qty: Math.max(1, Math.min(20, initQty||1)) };
  const foot = `<div class="bowl-foot">
      <div class="stepper"><button type="button" data-bq="-" aria-label="Azalt">${ICONS.minus}</button><span class="q" id="bowl-qty">${bowlSel.qty}</span><button type="button" data-bq="+" aria-label="Arttır">${ICONS.plus}</button></div>
      <button type="button" class="btn btn-primary btn-lg" id="bowl-add"><span id="bowl-add-label">Sepete Ekle</span><span class="btn-sub num" id="bowl-total"></span></button>
    </div>`;
  openModal(escapeHtml(it.name), '<div id="bowl-root"></div>', foot);
  const root = document.getElementById('bowl-root');
  root.addEventListener('change', e=>{
    const inp = e.target; if(!bowlSel || !inp.name) return;
    if(inp.name==='bowl-base'){ bowlSel.baseId = inp.value; }
    else if(inp.name==='bowl-chicken'){ bowlSel.chickenId = inp.value; }
    else if(inp.name==='bowl-garnish'){
      const max = state.options.maxGarnish||4;
      if(inp.checked){
        if(bowlSel.garnish.length >= max){ inp.checked = false; showToast('En fazla '+max+' garnitür seçebilirsiniz'); return; }
        bowlSel.garnish.push(inp.value);
      } else bowlSel.garnish = bowlSel.garnish.filter(x=>x!==inp.value);
    }
    else if(inp.name==='bowl-meze'){
      if(inp.checked){ if(!bowlSel.meze.includes(inp.value)) bowlSel.meze.push(inp.value); }
      else bowlSel.meze = bowlSel.meze.filter(x=>x!==inp.value);
    }
    renderBowl();
  });
  document.querySelector('.bowl-foot').addEventListener('click', e=>{
    const q = e.target.closest('[data-bq]');
    if(q){ bowlSel.qty = Math.max(1, Math.min(20, bowlSel.qty + (q.dataset.bq==='+'?1:-1))); renderBowlFoot(); return; }
    if(e.target.closest('#bowl-add')) addBowlToCart();
  });
  renderBowl();
}
function renderBowl(){
  const root = document.getElementById('bowl-root'); if(!root || !bowlSel) return;
  const it = state.items.find(x=>x.id===bowlSel.itemId);
  if(!it || it.available===false){ closeModal(); showToast('Bu ürün az önce tükendi'); return; }
  if(isEmergencyClosed()){ closeModal(); bowlSel = null; showToast(EMERGENCY_MSG); return; }   // dükkan o an kapatıldıysa
  // canlı stok: seçili malzeme tükendiyse seçimi kaldır
  const bs = optById('base', bowlSel.baseId);
  if(bowlSel.baseId && (!bs || bs.available===false)){ showToast((bs?bs.name:'Seçtiğiniz taban')+' az önce tükendi, lütfen başka bir taban seçin'); bowlSel.baseId=''; }
  const ch = optById('chicken', bowlSel.chickenId);
  if(bowlSel.chickenId && (!ch || ch.available===false)){ showToast((ch?ch.name:'Seçtiğiniz sos')+' az önce tükendi, lütfen başka bir çeşit seçin'); bowlSel.chickenId=''; }
  const lost = bowlSel.garnish.map(id=>optById('garnish', id)).filter(g=>!g || g.available===false);
  if(lost.length){ showToast(lost.map(g=>g?g.name:'Bir garnitür').join(', ')+' az önce tükendi'); bowlSel.garnish = bowlSel.garnish.filter(id=>{ const g=optById('garnish',id); return g && g.available!==false; }); }
  const lostM = bowlSel.meze.map(id=>optById('meze', id)).filter(g=>!g || g.available===false);
  if(lostM.length){ showToast(lostM.map(g=>g?g.name:'Bir meze').join(', ')+' az önce tükendi'); bowlSel.meze = bowlSel.meze.filter(id=>{ const g=optById('meze',id); return g && g.available!==false; }); }

  const opts = state.options, max = opts.maxGarnish||4, nG = bowlSel.garnish.length, nM = bowlSel.meze.length;
  const freeG = numOr(opts.freeGarnish, 3), freeM = numOr(opts.freeMeze, 1);
  const pG = numOr(opts.extraGarnishPrice, 10), pM = numOr(opts.extraMezePrice, 15);
  const x = bowlExtras(nG, nM);
  const tile = (type, group, o)=>{
    const sold = o.available===false;
    const list = group==='bowl-meze' ? bowlSel.meze : bowlSel.garnish;
    const sel = group==='bowl-base' ? bowlSel.baseId===o.id : type==='radio' ? bowlSel.chickenId===o.id : list.includes(o.id);
    const limit = group==='bowl-garnish' && !sel && !sold && nG>=max;
    // ücretsiz kota dolduysa: seçili ücretli olanlarda ve yeni seçilecek olanlarda ek ücret rozeti
    let extra = '';
    if(type==='check' && !sold && !limit){
      const free = group==='bowl-meze' ? freeM : freeG, price = group==='bowl-meze' ? pM : pG;
      const paid = sel ? list.indexOf(o.id) >= free : list.length >= free;
      if(paid && price>0) extra = `<span class="opt-extra">+${fmtPrice(price)}</span>`;
    }
    return `<label class="opt ${type} ${sel?'sel':''} ${sold?'sold':''} ${limit?'limit':''}">
      <input type="${type==='radio'?'radio':'checkbox'}" name="${group}" value="${escapeHtml(o.id)}" ${sel?'checked':''} ${(sold||limit)?'disabled':''}>
      <span class="opt-mark"></span><span class="opt-name">${escapeHtml(o.name)}</span>
      ${sold? '<span class="opt-sold">Tükendi</span>': extra}
    </label>`;
  };
  const freeTxt = (n, word)=> n>0 ? `İlk ${n} ${word} ücretsiz` : `Her ${word} ücretli`;
  root.innerHTML = `
    <div class="bowl-hero">
      ${it.photoUrl? `<img src="${escapeHtml(it.photoUrl)}" alt="">` : `<div class="ph">${ICONS.bowl}</div>`}
      <div>${it.description? `<p>${escapeHtml(it.description)}</p>`:'<p>Kendi Bowl\'unu oluştur: önce tabanını, sonra tavuğunu, garnitürlerini ve mezeni seç.</p>'}<span class="price">${fmtPrice(it.price)}</span></div>
    </div>
    <div class="opt-step">
      <div class="opt-title"><span class="opt-num">0</span><div><h4>Tabanınızı Seçin</h4><small>Tek seçim</small></div>
        <span class="opt-badge ${bowlSel.baseId?'ok':'req'}">${bowlSel.baseId?'✓ Seçildi':'Zorunlu'}</span></div>
      <div class="opt-grid" role="radiogroup">${(opts.base||[]).length? opts.base.map(o=>tile('radio','bowl-base',o)).join('') : '<div class="opt-empty">Henüz taban eklenmemiş.</div>'}</div>
    </div>
    <div class="opt-step">
      <div class="opt-title"><span class="opt-num">1</span><div><h4>Tavuk Çeşidini Seçin</h4><small>Tek seçim</small></div>
        <span class="opt-badge ${bowlSel.chickenId?'ok':'req'}">${bowlSel.chickenId?'✓ Seçildi':'Zorunlu'}</span></div>
      <div class="opt-grid" role="radiogroup">${opts.chicken.length? opts.chicken.map(o=>tile('radio','bowl-chicken',o)).join('') : '<div class="opt-empty">Henüz tavuk çeşidi eklenmemiş.</div>'}</div>
    </div>
    <div class="opt-step">
      <div class="opt-title"><span class="opt-num">2</span><div><h4>Garnitür Çeşitlerini Seçin</h4><small>${freeTxt(freeG,'garnitür')}${pG>0? ', sonrası +'+fmtPrice(pG):''} · en fazla ${max}</small></div>
        <span class="opt-badge ${nG? 'ok':''}">${nG}/${max}</span></div>
      <div class="opt-grid">${opts.garnish.length? opts.garnish.map(o=>tile('check','bowl-garnish',o)).join('') : '<div class="opt-empty">Henüz garnitür eklenmemiş.</div>'}</div>
    </div>
    <div class="opt-step">
      <div class="opt-title"><span class="opt-num">3</span><div><h4>Meze Seçimi</h4><small>${freeTxt(freeM,'meze')}${pM>0? ', sonrası +'+fmtPrice(pM):''} · isteğe bağlı</small></div>
        <span class="opt-badge ${nM? 'ok':''}">${nM? nM+' meze' : 'İsteğe bağlı'}</span></div>
      <div class="opt-grid">${(opts.meze||[]).length? opts.meze.map(o=>tile('check','bowl-meze',o)).join('') : '<div class="opt-empty">Henüz meze eklenmemiş.</div>'}</div>
    </div>
    <div class="bowl-sum" id="bowl-sum">
      <div class="bs-row"><span>Bowl</span><span class="num">${fmtPrice(it.price)}</span></div>
      ${x.extraGarnish? `<div class="bs-row x"><span>Ekstra garnitür (${x.paidG} × ${fmtPrice(pG)})</span><span class="num">+${fmtPrice(x.extraGarnish)}</span></div>`:''}
      ${x.extraMeze? `<div class="bs-row x"><span>Ekstra meze (${x.paidM} × ${fmtPrice(pM)})</span><span class="num">+${fmtPrice(x.extraMeze)}</span></div>`:''}
      <div class="bs-row t"><span>1 adet</span><span class="num">${fmtPrice(it.price + x.extra)}</span></div>
    </div>`;
  renderBowlFoot();
}
function renderBowlFoot(){
  const it = bowlSel && state.items.find(x=>x.id===bowlSel.itemId); if(!it) return;
  const q = document.getElementById('bowl-qty'); if(q) q.textContent = bowlSel.qty;
  const t = document.getElementById('bowl-total'); if(t) t.textContent = fmtPrice((it.price + bowlExtras(bowlSel.garnish.length, bowlSel.meze.length).extra) * bowlSel.qty);
  const ready = bowlSel.baseId && bowlSel.chickenId;
  const b = document.getElementById('bowl-add'); if(b) b.disabled = !ready;
  const l = document.getElementById('bowl-add-label'); if(l) l.textContent = ready ? 'Sepete Ekle' : !bowlSel.baseId ? 'Önce taban seçin' : 'Şimdi tavuk seçin';
}
function addBowlToCart(){
  const it = state.items.find(x=>x.id===bowlSel.itemId);
  if(!it || it.available===false){ closeModal(); showToast('Bu ürün tükendi'); return; }
  if(isEmergencyClosed()){ closeModal(); bowlSel = null; showToast(EMERGENCY_MSG); return; }
  const bs = optById('base', bowlSel.baseId);
  if(!bs || bs.available===false){ showToast('Lütfen bir taban seçin'); return; }
  const ch = optById('chicken', bowlSel.chickenId);
  if(!ch || ch.available===false){ showToast('Lütfen bir tavuk çeşidi seçin'); return; }
  const gs = bowlSel.garnish.map(id=>optById('garnish', id)).filter(g=>g && g.available!==false);
  const ms = bowlSel.meze.map(id=>optById('meze', id)).filter(g=>g && g.available!==false);
  const x = bowlExtras(gs.length, ms.length);
  const options = { baseId: bs.id, base: bs.name, chickenId: ch.id, chicken: ch.name, garnishIds: gs.map(g=>g.id), garnish: gs.map(g=>g.name),
    mezeIds: ms.map(g=>g.id), meze: ms.map(g=>g.name), extraGarnish: x.extraGarnish, extraMeze: x.extraMeze, extra: x.extra };
  const key = lineKey(it.id, options);
  if(!cart[key]) cart[key] = { itemId: it.id, qty:0, price: it.price + x.extra, name: it.name, options };
  cart[key].qty += bowlSel.qty;
  saveCart(); updateItemControl(it.id); updateDock(true);
  closeModal(); bowlSel = null;
  showToast(it.name + ' sepete eklendi', 'success');
}

/* ============================= BÖLGE BİLGİSİ & KONUM KONTROLÜ =============================
   Konum yalnızca bu cihazda uzaklık hesaplamak için kullanılır; hiçbir yere gönderilmez/kaydedilmez. */
const DELIVERY_AREA = { name:'Bergama Merkez', lat:39.1214, lng:27.1799, radiusKm:5 };   // gerekirse buradan değiştirin
let geoState = 'idle', geoKm = null;   // idle | checking | inside | outside | denied | unsupported
function distKm(lat1, lng1, lat2, lng2){
  const R = 6371, r = x => x*Math.PI/180, dLat = r(lat2-lat1), dLng = r(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function fmtKm(k){ return k < 10 ? k.toFixed(1).replace('.',',') : Math.round(k).toString(); }
const UA = navigator.userAgent || '';
const IS_INAPP = /Instagram|FBAN|FBAV|FB_IAB/i.test(UA);
const IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/i.test(UA);
function updateRegion(){
  const el = document.getElementById('region'); if(!el) return;
  const km = geoKm!=null ? fmtKm(geoKm) : '–';
  const retry = `<button type="button" class="rg-btn" data-geo-retry>Konumumu kontrol et</button>`;
  const help = `<button type="button" class="rg-btn" data-geo-help>İzin nasıl açılır?</button>`;
  const st = {
    idle:'<span class="sp"></span>Konumunuz kontrol ediliyor…',
    checking:'<span class="sp"></span>Konumunuz kontrol ediliyor…',
    inside:`✓ Konumunuz teslimat bölgemizde (${DELIVERY_AREA.name}'e yaklaşık ${km} km).`,
    outside:`⚠ Konumunuz teslimat bölgemizin dışında görünüyor (${DELIVERY_AREA.name}'e yaklaşık ${km} km). Adresiniz Bergama Merkez'de değilse siparişinizi teslim edemeyiz. ${retry}`,
    denied:`Konum izni verilmedi. Lütfen adresinizin Bergama Merkez sınırları içinde olduğundan emin olun. ${retry}`,
    blocked:`Konum izni ${IS_INAPP ? 'Instagram tarayıcısında' : 'telefonunuzun ayarlarında'} kapalı, bu yüzden site tekrar soramıyor. ${help}${retry}`,
    unavailable:`Konumunuz alınamadı. Telefonunuzun konum servisi kapalı olabilir. ${help}${retry}`,
    timeout:`Konum bulunamadı (zaman aşımı). Açık bir alanda tekrar deneyin. ${retry}`,
    unsupported:'Cihazınız konum kontrolünü desteklemiyor. Lütfen adresinizin Bergama Merkez sınırları içinde olduğundan emin olun.'
  }[geoState];
  el.className = 'region glass ' + geoState;
  el.innerHTML = `<div class="rg-ico" aria-hidden="true">📍</div>
    <div class="rg-txt"><b>Teslimat Hizmetimiz Sadece Bergama Merkez Sınırları İçerisindedir.</b><span class="rg-st ${geoState}">${st}</span></div>`;
}
let geoTries = 0;
function requestLocation(manual){
  if(!('geolocation' in navigator)){ geoState = 'unsupported'; updateRegion(); return; }
  if(geoState==='checking' && geoTries>0 && !manual) return;
  geoTries++;
  geoState = 'checking'; updateRegion();
  const started = Date.now();
  navigator.geolocation.getCurrentPosition(pos=>{
    geoKm = distKm(pos.coords.latitude, pos.coords.longitude, DELIVERY_AREA.lat, DELIVERY_AREA.lng);
    geoState = geoKm <= DELIVERY_AREA.radiusKm ? 'inside' : 'outside';
    updateRegion();
    if(manual) showToast(geoState==='inside' ? 'Konumunuz teslimat bölgemizde ✓' : 'Konumunuz Bergama Merkez dışında görünüyor', geoState==='inside' ? 'success' : '');
  }, err=>{
    const code = err && err.code;
    if(code===1){
      // izin daha önce reddedildiyse tarayıcı tekrar sormaz, anında hata döner
      geoState = (manual || geoTries>1 || IS_INAPP || Date.now()-started < 600) ? 'blocked' : 'denied';
    } else if(code===2) geoState = 'unavailable';
    else if(code===3) geoState = 'timeout';
    else geoState = 'denied';
    updateRegion();
    if(manual && (geoState==='blocked' || geoState==='unavailable')) openGeoHelp();
  }, { enableHighAccuracy:false, timeout:12000, maximumAge:600000 });
}
function openGeoHelp(){
  let steps;
  if(IS_INAPP) steps = [
    "Bu sayfayı Instagram'ın kendi tarayıcısında açtınız; Instagram konum izni vermeyebiliyor.",
    "Sağ üstteki <b>⋯</b> (üç nokta) simgesine dokunun.",
    IS_IOS ? "<b>Safari'de aç</b> (veya <b>Tarayıcıda aç</b>) seçeneğini seçin." : "<b>Chrome'da aç</b> (veya <b>Tarayıcıda aç</b>) seçeneğini seçin.",
    "Açılan sayfada konum sorulunca <b>İzin Ver</b> deyin."];
  else if(IS_IOS) steps = [
    "Adres çubuğundaki <b>aA</b> simgesine dokunun → <b>Web Sitesi Ayarları</b> → <b>Konum</b> → <b>İzin Ver</b>.",
    "Olmazsa iPhone <b>Ayarlar</b> → <b>Gizlilik ve Güvenlik</b> → <b>Konum Servisleri</b> açık olsun; aynı listede <b>Safari Web Siteleri</b> → <b>Uygulamayı Kullanırken</b> seçin.",
    "Chrome kullanıyorsanız: <b>Ayarlar</b> → <b>Chrome</b> → <b>Konum</b> → <b>Uygulamayı Kullanırken</b>.",
    "Sayfayı yenileyip <b>Konumumu kontrol et</b>'e dokunun."];
  else if(IS_ANDROID) steps = [
    "Telefonun üstten açılan menüsünde <b>Konum</b> (GPS) açık olsun.",
    "Adres çubuğundaki <b>kilit / ayar</b> simgesine dokunun → <b>İzinler</b> → <b>Konum</b> → <b>İzin ver</b>.",
    "Sayfayı yenileyip <b>Konumumu kontrol et</b>'e dokunun."];
  else steps = [
    "Adres çubuğundaki <b>kilit</b> simgesine tıklayın → <b>Konum</b> → <b>İzin ver</b>.",
    "Sayfayı yenileyip <b>Konumumu kontrol et</b>'e tıklayın."];
  const body = `<ol class="geo-steps">${steps.map(x=>`<li>${x}</li>`).join('')}</ol>
    <p class="hint" style="margin-top:12px;">Konumunuz yalnızca bu telefonda Bergama Merkez'e uzaklığı hesaplamak için kullanılır, hiçbir yere kaydedilmez.</p>`;
  const foot = `<button type="button" class="btn btn-ghost" id="gh-close">Kapat</button><button type="button" class="btn btn-primary" id="gh-retry">Tekrar Dene</button>`;
  openModal('Konum İznini Açın', body, foot);
  document.getElementById('gh-close').addEventListener('click', closeModal);
  document.getElementById('gh-retry').addEventListener('click', ()=>{ closeModal(); setTimeout(()=>requestLocation(true), 250); });
}

/* ============================= KAMPANYA POP-UP =============================
   Varsayılan metin buradan, güncel metin Yönetim Paneli → Ayarlar → Kampanya Pop-up'tan değiştirilir. */
const CAMPAIGN_DEFAULT = {
  enabled: true,
  title: 'Sana Özel Kampanya',
  text: "🎁 RiceMore'a Hoş Geldin! İlk Siparişine Özel Sürpriz İkramlar ve Günün Fırsatları Seni Bekliyor.",
  button: 'Fırsatları İncele'
};
function campaign(){ return Object.assign({}, CAMPAIGN_DEFAULT, state.settings.campaign || {}); }
function showCampaign(preview){
  const c = campaign();
  if(!preview){
    if(!c.enabled || view!=='menu') return;
    try{ if(sessionStorage.getItem('rm_campaign_seen')) return; }catch(e){}
    if(document.getElementById('modal-overlay')){ setTimeout(()=>showCampaign(), 4000); return; }   // açık pencere varsa bekle
    try{ sessionStorage.setItem('rm_campaign_seen','1'); }catch(e){}
  }
  const body = `<div class="cp-gift" aria-hidden="true">🎁</div>
    <h2 class="cp-title">${escapeHtml(c.title)}</h2>
    <p class="cp-text">${escapeHtml(c.text)}</p>
    <div class="cp-rule" aria-hidden="true"><i></i></div>`;
  const foot = `<button type="button" class="btn btn-ghost" id="cp-ok">Tamam</button><button type="button" class="btn btn-primary" id="cp-go" style="min-width:180px;min-height:48px;">${escapeHtml(c.button || 'Fırsatları İncele')}</button>`;
  openModal('RICEMORE', body, foot, 'campaign');
  document.getElementById('cp-ok').addEventListener('click', closeModal);
  document.getElementById('cp-go').addEventListener('click', ()=>{
    closeModal();
    if(view==='menu'){ const m = document.getElementById('menu-list'); if(m) setTimeout(()=>window.scrollTo({top: m.offsetTop - 130, behavior:'smooth'}), 220); }
  });
}
function startWelcomeFlow(){
  if(view!=='menu') return;
  requestLocation();                 // 1) konum izni + bölge bilgisi

}

/* ============================= MUTFAK BİLDİRİMLERİ (ntfy) + SERVICE WORKER =============================
   Yeni sipariş onaylanınca müşterinin tarayıcısı ntfy.sh'a kısa bir bildirim yollar; mutfak telefonundaki
   ücretsiz "ntfy" uygulaması bunu ekran kilitliyken / tarayıcı kapalıyken bile sesli + titreşimli gösterir.
   Kanal adı gizli bir şifre gibidir: Yönetim Paneli → Ayarlar → Mutfak Bildirimleri'nden görülür/değiştirilir. */
const NTFY_SERVER = 'https://ntfy.sh';
const NTFY_DEFAULT_TOPIC = 'ricemore-mutfak-96dca29b45f3eb92';
function ntfyCfg(){ const s = state.settings; return { enabled: s.ntfyEnabled !== false, topic: String(s.ntfyTopic || NTFY_DEFAULT_TOPIC).trim() }; }
function kitchenLink(){ return location.origin + location.pathname + '#mutfak'; }
function notifyKitchen(order, test){
  const c = ntfyCfg();
  if((!c.enabled && !test) || !c.topic || location.protocol==='file:' && !window.__allowFileNtfy) return Promise.resolve(false);
  const body = test
    ? { topic:c.topic, title:'🔔 Test Bildirimi - RiceMore', message:'Bildirimler çalışıyor! Yeni siparişler bu şekilde gelecek.', priority:5, tags:['bell'], click:kitchenLink() }
    : { topic:c.topic, title:'🔔 Yeni Sipariş Alındı! - RiceMore',
        message:`Müşteri: ${order.customerName || '—'} | Tutar: ${fmtMoney(order.total, state.settings.currency)} - Detaylar için tıklayın.`,
        priority:5, tags:['bell'], click:kitchenLink() };
  return fetch(NTFY_SERVER, { method:'POST', body: JSON.stringify(body), keepalive:true })
    .then(r=>r.ok).catch(()=>false);
}
function newTopic(){
  const b = new Uint8Array(8); (window.crypto||{}).getRandomValues ? crypto.getRandomValues(b) : b.forEach((_,i)=>b[i]=Math.random()*256|0);
  return 'ricemore-mutfak-' + [...b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
/* Service Worker: önbellek tutmaz (yeni sürüm hep anında görünür); bildirime dokununca paneli açar */
let swReg = null;
function registerSW(){
  if(!('serviceWorker' in navigator) || location.protocol==='file:') return;
  navigator.serviceWorker.register('sw.js').then(r=>{ swReg = r; }).catch(()=>{});
}
function askNotifyPermission(){
  if(!('Notification' in window) || Notification.permission!=='default') return Promise.resolve(window.Notification ? Notification.permission : 'unsupported');
  try{ return Promise.resolve(Notification.requestPermission()).catch(()=> 'default'); }catch(e){ return Promise.resolve('default'); }
}
/* Sayfa arka plandayken (başka sekme / ekran kapalıyken tarayıcı açıksa) bu cihazda bildirim göster */
function localNotify(title, body, tag, url){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const opts = { body, tag, renotify:true, icon:'icon-192.png', badge:'icon-192.png', vibrate:[250,120,250], data:{ url: url || location.href } };
  if(swReg && swReg.showNotification) swReg.showNotification(title, opts).catch(()=>{});
  else { try{ new Notification(title, opts); }catch(e){} }
}

/* ============================= TELEFON ============================= */
function normPhone(v){
  let d = String(v||'').replace(/\D/g,'');
  if(d.startsWith('90') && d.length===12) d = '0' + d.slice(2);
  if(d.length===10 && d[0]==='5') d = '0' + d;
  return d;
}
function validPhone(v){ return /^05\d{9}$/.test(normPhone(v)); }
function fmtPhone(v){
  const d = normPhone(v).slice(0,11);
  return [d.slice(0,4), d.slice(4,7), d.slice(7,9), d.slice(9,11)].filter(Boolean).join(' ');
}
function telHref(v){ const d = normPhone(v); return 'tel:+90' + d.slice(1); }

function sendOrder(){
  const lines = Object.entries(cart);
  if(!lines.length){ showToast('Sepetiniz boş'); return; }
  if(isEmergencyClosed()){                            // acil kapatma / tatil modu: sipariş alınmaz
    showToast(EMERGENCY_MSG);
    const cc = document.getElementById('cart-closed'); if(cc){ cc.innerHTML = `<div class="notice danger">🚨 ${EMERGENCY_MSG}</div>`; cc.scrollIntoView({block:'center', behavior:'smooth'}); }
    return;
  }
  const nameEl = document.getElementById('cart-name'), addrEl = document.getElementById('cart-address'), phoneEl = document.getElementById('cart-phone');
  const name = nameEl.value.trim();
  const phoneOk = validPhone(phoneEl.value), phone = phoneOk ? fmtPhone(phoneEl.value) : '';
  const address = (document.getElementById('cart-address')?.value || '').trim();
  const note = document.getElementById('cart-note').value.trim();
  let firstBad = null;
  [[nameEl,name],[phoneEl,phone],[addrEl,address]].forEach(([el,v])=>{ el.closest('.field').classList.toggle('invalid', !v); if(!v && !firstBad) firstBad = el; });
  const ph = document.getElementById('phone-hint');
  if(ph){ ph.textContent = phoneOk ? 'Siparişinizle ilgili sizi arayabilmemiz için.' : 'Geçerli bir cep telefonu girin: 05XX XXX XX XX (11 hane).'; ph.style.color = phoneOk ? '' : 'var(--danger)'; }
  if(firstBad){
    firstBad.focus();
    showToast(firstBad===phoneEl ? (phoneEl.value.trim() ? 'Telefon numarası eksik veya hatalı. Örnek: 0536 123 45 67' : 'Lütfen telefon numaranızı girin') : 'Lütfen ad soyad, telefon ve teslimat adresini girin');
    return;
  }

  const removedNow = sanitizeCart();                 // son anda tükenen ürün/malzeme kontrolü
  if(removedNow.length){ showToast('Tükendi, sepetinizden çıkarıldı: ' + removedNow.join(', ')); renderCartLines(); refreshAllControls(); updateDock(); return; }
  const btn = document.getElementById('cart-send'); if(btn) btn.disabled = true;   // çift tıklamayla mükerrer sipariş olmasın
  const total = cartTotal();
  const order = {
    id: uid('ord'),
    createdAt: new Date().toISOString(),
    items: Object.entries(cart).map(([key,c])=>{
      const li = { itemId: lineItemId(key,c), name:c.name, price:c.price, qty:c.qty };
      if(c.options){
        li.options = { chicken: c.options.chicken, garnish: c.options.garnish || [] };
        if(c.options.base) li.options.base = c.options.base;
        if((c.options.meze||[]).length) li.options.meze = c.options.meze;
        if(c.options.extra){ li.options.extraGarnish = c.options.extraGarnish||0; li.options.extraMeze = c.options.extraMeze||0; li.options.extra = c.options.extra; }
      }
      return li;
    }),
    total,
    customerName: name,
    phone: phone,
    address: address,
    note: note,
    status: 'yeni'
  };
  if(!pushOrder(order)){ if(btn) btn.disabled = false; return; }   // bağlantı yoksa sepet korunur
  notifyKitchen(order);                                              // mutfak telefonuna (ntfy) sesli bildirim
  askNotifyPermission();                                             // sipariş durumu değişince bu telefona haber verebilmek için

  saveCustomer({name, address, phone});
  setActiveOrder({ id:order.id, createdAt:order.createdAt, items:order.items, total, address, customerName:name });
  cart = {}; saveCart();
  refreshAllControls(); updateDock();
  showToast('Siparişiniz Mutfak Paneline İletildi!', 'success');
  trackStatus = 'yeni';
  startTracking();
  openTracking();
}

/* ============================= CANLI SİPARİŞ TAKİBİ (MÜŞTERİ) =============================
   Firebase: qrmenu_data/orders/{orderId}/status yolunu canlı dinler.
   Sayfa yenilense de sipariş bu cihazda hatırlanır. */
const ACTIVE_KEY = 'qrmenu_active_order_v1';
const STATUS_META = {
  yeni:         { step:0, title:'Siparişiniz alındı',  text:'Siparişiniz mutfağımıza ulaştı. Birazdan hazırlanmaya başlayacak.', icon:'bell' },
  hazirlaniyor: { step:1, title:'Hazırlanıyor',        text:'Şefimiz siparişinizi özenle hazırlıyor.', icon:'pan' },
  yolda:        { step:2, title:'Siparişiniz yolda!',  text:'Kuryemiz siparişinizi teslim etmek üzere yola çıktı. Sıcak ve taze olarak geliyor.', icon:'motor' },
  tamamlandi:   { step:3, title:'Siparişiniz hazır!',  text:'Siparişiniz tamamlandı. Afiyet olsun!', icon:'check' },
  iptal:        { step:-1, title:'Sipariş iptal edildi', text:'Siparişiniz iptal edildi. Bilgi için işletmeyle iletişime geçebilirsiniz.', icon:'close' },
  kayip:        { step:-1, title:'Sipariş bulunamadı', text:'Bu sipariş artık sistemde görünmüyor.', icon:'close' },
};
const STEP_LABELS = ['Sipariş Alındı','Hazırlanıyor','Yolda','Tamamlandı'];
const LAST_STEP = STEP_LABELS.length - 1;   // 3 → tamamlandı = %100
let trackRef = null, trackStatus = null;

function getActiveOrder(){ try{ return JSON.parse(localStorage.getItem(ACTIVE_KEY)) || null; }catch(e){ return null; } }
function setActiveOrder(o){ try{ if(o) localStorage.setItem(ACTIVE_KEY, JSON.stringify(o)); else localStorage.removeItem(ACTIVE_KEY); }catch(e){} }
function isFinal(s){ return s==='tamamlandi' || s==='iptal' || s==='kayip'; }

function startTracking(){
  const a = getActiveOrder(); if(!a || !fbRef) return;
  if(trackRef) trackRef.off();
  let first = true;
  trackRef = fbRef.child('orders').child(a.id).child('status');
  trackRef.on('value', snap=>{
    const s = snap.val() || 'kayip';
    const prev = trackStatus;
    trackStatus = STATUS_META[s] ? s : 'yeni';
    // eski, bitmiş siparişleri (6 saatten eski) sessizce kapat
    if(first && isFinal(trackStatus) && (Date.now() - new Date(a.createdAt).getTime()) > 6*3600*1000){ first=false; stopTracking(); return; }
    first = false;
    if(prev && prev!==trackStatus){
      if(navigator.vibrate) navigator.vibrate([120,60,120]);
      const label = {hazirlaniyor:'👨‍🍳 Siparişiniz hazırlanıyor', yolda:'🛵 Siparişiniz yolda! Kuryemiz yola çıktı.', tamamlandi:'✅ Siparişiniz hazır, afiyet olsun!', iptal:'Siparişiniz iptal edildi'}[trackStatus];
      if(label && !document.getElementById('track-root')) showToast(label, trackStatus==='iptal'?'':'success');
      if(label && document.hidden) localNotify('RiceMore · Sipariş Takibi', label, 'track', location.origin + location.pathname);
    }
    renderTrack(); updateDock();
  }, ()=>{});
}
function stopTracking(){
  if(trackRef) trackRef.off();
  trackRef = null; trackStatus = null; setActiveOrder(null); updateDock();
}
function openTracking(){
  if(!getActiveOrder()){ showToast('Henüz aktif bir siparişiniz yok'); return; }
  openModal('Sipariş Takibi', '<div id="track-root"></div>', '');
  const root = document.getElementById('track-root');
  root.addEventListener('click', e=>{
    const t = e.target.closest('[data-track]'); if(!t) return;
    if(t.dataset.track==='new'){ stopTracking(); closeModal(); window.scrollTo({top:0, behavior:'smooth'}); }
    else closeModal();
  });
  renderTrack();
}
function renderTrack(){
  const root = document.getElementById('track-root'); if(!root) return;
  const a = getActiveOrder(); if(!a){ closeModal(); return; }
  const key = trackStatus || 'yeni', m = STATUS_META[key], final = isFinal(key);
  const code = String(a.id).slice(-5).toUpperCase();
  root.innerHTML = `
    <div class="track state-${key}">
      <div class="track-visual"><div class="tv-ring"></div><div class="tv-icon">${ICONS[m.icon]}</div></div>
      <h2 class="track-title">${m.title}</h2>
      <p class="track-text">${m.text}</p>
      <div class="track-meta">
        <span class="live-dot ${final?'off':''}">${final?'Takip tamamlandı':'Canlı takip'}</span>
        <span class="code">#${escapeHtml(code)}</span>
        <span id="track-ago">${waitText(a.createdAt)}</span>
      </div>
      ${m.step>=0? `<ol class="steps" style="--p:${m.step/LAST_STEP}">
        ${STEP_LABELS.map((t,i)=>{ const done = i<m.step || m.step===LAST_STEP; const active = i===m.step && m.step!==LAST_STEP;
          return `<li class="${done?'done':''} ${active?'active':''}"><span class="st-dot">${done? ICONS.check : i+1}</span><span>${t}</span></li>`; }).join('')}
      </ol>` : '<div style="height:18px"></div>'}
      <div class="track-card">
        ${toList(a.items).map(li=>`<div class="tc-row"><span>${li.qty}× ${escapeHtml(li.name)}</span><span class="num">${fmtPrice(li.price*li.qty)}</span></div>${li.options? `<div class="tc-opts">${escapeHtml(optsText(li.options))}</div>`:''}`).join('')}
        <div class="tc-row total"><span>Toplam</span><span class="num">${fmtPrice(a.total)}</span></div>
        ${a.address? `<div class="tc-addr">${ICONS.pin}<span>${escapeHtml(a.address)}</span></div>`:''}
      </div>
      <div class="track-actions">
        ${final? `<button type="button" class="btn btn-primary btn-block" data-track="new" style="min-height:50px;">Yeni Sipariş Ver</button>`
               : `<button type="button" class="btn btn-block" data-track="close" style="min-height:50px;">Menüye Dön</button>`}
      </div>
    </div>`;
}

          </div>

            <button class="icon-btn" data-cat-edit="${c.id}">${ICONS.edit}</button>

        </div>`).join('')}</div>` : `<div class="hint">Henüz kategori yok. Önce bir kategori ekleyin (örn. Ana Yemekler, İçecekler).</div>`}
    </div>

    <div class="card">

      ${!cats.length? `<div class="hint">Ürün eklemeden önce en az bir kategori oluşturmalısınız.</div>` :
        state.items.length? `<table><thead><tr><th></th><th>Ürün</th><th>Kategori</th><th>Fiyat</th><th>Durum</th><th></th></tr></thead>
        <tbody>${state.items.map(it=>{
          const cat = cats.find(c=>c.id===it.categoryId);
          return `<tr>
            <td>${it.photoUrl? `<img class="thumb" src="${it.photoUrl}">` : `<div class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text-faint);">Yok</div>`}</td>
            <td><strong>${escapeHtml(it.name)}</strong>${it.badge?` <span class="hint">(${it.badge})</span>`:''}</td>
            <td>${cat?escapeHtml(cat.name):'<span class="hint">—</span>'}</td>
            <td class="num">${fmtMoney(it.price, state.settings.currency)}</td>
            <td>${it.available===false? '<span class="pill danger">Tükendi</span>' : '<span class="pill ok">Mevcut</span>'}</td>
            <td><div class="row-actions">

            </div></td>

  root.querySelectorAll('[data-cat-edit]').forEach(b=>b.addEventListener('click',()=>openCategoryModal(state.categories.find(c=>c.id===b.dataset.catEdit))));
  root.querySelectorAll('[data-cat-del]').forEach(b=>b.addEventListener('click',()=>{
    const id = b.dataset.catDel;
    const used = state.items.some(it=>it.categoryId===id);
    if(used){ showToast('Bu kategoride ürünler var, önce onları taşıyın veya silin'); return; }
    if(confirm('Bu kategoriyi silmek istiyor musunuz?')){ state.categories = state.categories.filter(c=>c.id!==id); saveState(); render(); }
  }));
  root.querySelectorAll('[data-cat-up]').forEach(b=>b.addEventListener('click',()=>{ moveCategory(b.dataset.catUp,-1); }));
  root.querySelectorAll('[data-cat-down]').forEach(b=>b.addEventListener('click',()=>{ moveCategory(b.dataset.catDown,1); }));
  const addItemBtn = root.querySelector('#add-item');
  if(addItemBtn) addItemBtn.addEventListener('click',()=>openItemModal(null));
  root.querySelectorAll('[data-item-edit]').forEach(b=>b.addEventListener('click',()=>openItemModal(state.items.find(it=>it.id===b.dataset.itemEdit))));
  root.querySelectorAll('[data-item-del]').forEach(b=>b.addEventListener('click',()=>{
    if(confirm('Bu ürünü silmek istiyor musunuz?')){ state.items = state.items.filter(it=>it.id!==b.dataset.itemDel); saveState(); render(); }
  }));
  root.querySelectorAll('[data-item-toggle]').forEach(b=>b.addEventListener('click',()=>{
    const it = state.items.find(x=>x.id===b.dataset.itemToggle);
    it.available = it.available===false ? true : false;
    saveState(); render();
  }));
}
function moveCategory(id, dir){
  const cats = [...state.categories].sort((a,b)=>(a.order||0)-(b.order||0));
  const idx = cats.findIndex(c=>c.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=cats.length) return;
  const a = cats[idx], b = cats[swapIdx];
  const tmp = a.order; a.order = b.order; b.order = tmp;
  saveState(); render();
}
function openCategoryModal(existing){
  const body = `<div class="field"><label>Kategori Adı</label><input type="text" id="cat-name" value="${existing?escapeHtml(existing.name):''}" placeholder="Örn. Ana Yemekler"></div>`;
  const foot = `<button class="btn btn-ghost" id="cat-cancel">Vazgeç</button><button class="btn btn-primary" id="cat-save">${existing?'Güncelle':'Kaydet'}</button>`;
  openModal(existing?'Kategoriyi Düzenle':'Yeni Kategori', body, foot);
  document.getElementById('cat-cancel').addEventListener('click', closeModal);
  document.getElementById('cat-save').addEventListener('click',()=>{
    const name = document.getElementById('cat-name').value.trim();
    if(!name){ showToast('Kategori adı girin'); return; }
    if(existing) existing.name = name;
    else state.categories.push({ id:uid('cat'), name, order: state.categories.length });
    saveState(); closeModal(); render();
  });
}
function openItemModal(existing){

  const foot = `<button class="btn btn-ghost" id="it-cancel">Vazgeç</button><button class="btn btn-primary" id="it-save">${existing?'Güncelle':'Kaydet'}</button>`;

    document.getElementById('it-photo-remove').style.display = photoData ? '' : 'none';
    document.getElementById('it-photo-drop').textContent = photoData ? 'Fotoğrafı değiştirmek için tıklayın' : 'Fotoğraf seçmek için tıklayın';
    document.getElementById('it-photo-hint').textContent = (!photoData && hadPhoto) ? 'Görsel kaldırıldı. Kalıcı olması için "Güncelle"ye basın.' : '';

    catch(err){ showToast('Fotoğraf işlenemedi'); showPhoto(); }

  document.getElementById('it-photo-url').addEventListener('change', e=>{

    if(!v) return;

    photoData = v; showPhoto();

  document.getElementById('it-photo-remove').addEventListener('click', ()=>{
    photoData = null;
    document.getElementById('it-photo-input').value = '';
    document.getElementById('it-photo-url').value = '';

      badge: document.getElementById('it-badge').value || null,
      isBowl: document.getElementById('it-bowl').checked,
      photoUrl: photoData
    };
    if(existing) Object.assign(existing, data);
    else state.items.push({ id:uid('it'), available:true, ...data });
    saveState(); closeModal(); render();
  });
}

const ORDER_TABS = [
  { id:'yeni',         label:'Yeni',            icon:'🆕', match:o=> !o.status || o.status==='yeni' },

let orderTabBump = '', archiveShowAll = false;
function orderTabOf(status){ const o = {status}; return (ORDER_TABS.find(t=>t.match(o))||ORDER_TABS[3]).id; }
function setOrderTab(id){ orderTab = id; try{ sessionStorage.setItem('rm_order_tab', id); }catch(e){} }
/* Hızlı aksiyon: bir sonraki adım */
const NEXT_STEP = {
  yeni:         { to:'hazirlaniyor', text:'👨‍🍳 Hazırlamaya Başla', cls:'prep' },
  hazirlaniyor: { to:'yolda',        text:'🛵 Yola Çıkar',          cls:'road' },
  yolda:        { to:'tamamlandi',   text:'✅ Teslim Edildi',        cls:'done' }
};
function moveOrder(id, status, rowEl){
  const o = getOrders().find(x=>x.id===id); if(!o || o.status===status) return;
  const from = orderTabOf(o.status), to = orderTabOf(status);
  const apply = ()=>{
    updateOrderStatus(id, status);
    if(from!==to){
      orderTabBump = to;
      const t = ORDER_TABS.find(x=>x.id===to);
      showToast(`Sipariş "${t.label}" sekmesine taşındı`, 'success');
    }
    render();
  };
  if(rowEl && from!==to){ rowEl.classList.add('leaving'); setTimeout(apply, 280); }   // kart akıcı şekilde kayarak çıkar
  else apply();
}

    yolda:['🛵','Yolda olan sipariş yok.'], arsiv:['📦','Henüz tamamlanan veya iptal edilen sipariş yok.'] }[tab.id];
  const bump = orderTabBump; orderTabBump = '';
  root.innerHTML = `
  <div class="orders-toolbar">

  </div>

    <button type="button" class="otab ${t.id===orderTab?'active':''} ${t.id===bump?'bump':''}" data-otab="${t.id}" role="tab" aria-selected="${t.id===orderTab}">
      <span class="oi">${t.icon}</span><span>${t.label}</span><span class="oc ${t.id==='yeni' && counts.yeni? 'hot':''}">${counts[t.id]}</span>
    </button>`).join('')}</div>
  <div class="card">
    ${orders.length? `<div class="kv-list ord-list">${orders.map(o=>{ const nx = NEXT_STEP[o.status||'yeni']; return `
      <div class="kv-row ${freshOrderIds.has(o.id)?'order-fresh':''}" data-order-row="${o.id}" style="align-items:flex-start;">
        <div>
          <div class="adm-items">${toList(o.items).map(li=>{ const op = li.options, g = op? toList(op.garnish) : [];
            return `<div class="adm-item"><strong>${li.qty}x ${escapeHtml(li.name)}</strong>${op? `<div class="adm-opts">${op.base? `<span class="adm-tag base">${baseIcon(op.base)} Taban: ${escapeHtml(op.base)}</span>`:''}${op.chicken? `<span class="adm-tag sos">🍗 ${escapeHtml(op.chicken)}</span>`:''}${g.map(x=>`<span class="adm-tag">${escapeHtml(x)}</span>`).join('')}${!g.length? '<span class="adm-tag">Garnitürsüz</span>':''}${Number(op.extraGarnish)? `<span class="adm-tag extra">+${fmtPrice(op.extraGarnish)} Ekstra garnitür</span>`:''}${toList(op.meze).length? `<span class="adm-tag meze">🧆 Meze: ${escapeHtml(toList(op.meze).join(', '))}</span>`:''}${Number(op.extraMeze)? `<span class="adm-tag extra">+${fmtPrice(op.extraMeze)} Ekstra meze</span>`:''}</div>`:''}</div>`; }).join('')}</div>
          <div class="hint">${fmtDateTime(o.createdAt)}${o.customerName?' · '+escapeHtml(o.customerName):''}${o.address ? ' · Adres: ' + escapeHtml(o.address) : ''}${o.note?' · Not: '+escapeHtml(o.note):''}</div>
          ${o.phone? `<a class="tel-link" href="${escapeHtml(telHref(o.phone))}" title="Müşteriyi ara">📞 ${escapeHtml(fmtPhone(o.phone))}</a>`:''}
          <div class="num" style="margin-top:4px;">${fmtMoney(o.total, state.settings.currency)}${isWaiting(o)? `<span class="wait-badge ${waitClass(o.createdAt)}" data-since="${o.createdAt}">⏱ ${waitText(o.createdAt)}</span>`:''}</div>
        </div>
        <div class="ord-side">
          <select data-order-status="${o.id}" class="pill ${statusClass[o.status]||'info'}" style="border:none;">
            ${Object.keys(statusLabel).map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${statusLabel[s]}</option>`).join('')}
          </select>
          ${nx? `<button type="button" class="btn btn-sm ord-act ${nx.cls}" data-order-next="${o.id}" data-to="${nx.to}">${nx.text}</button>`:''}
        </div>
      </div>`; }).join('')}</div>
      ${hidden? `<button type="button" class="btn btn-sm btn-block" id="arch-more" style="margin-top:12px;">Daha eski ${hidden} siparişi göster</button>`:''}`
    : `<div class="ord-empty"><span class="ei">${emptyText[0]}</span>${emptyText[1]}</div>`}
  </div>`;
  root.querySelectorAll('[data-otab]').forEach(b=>b.addEventListener('click',()=>{ setOrderTab(b.dataset.otab); archiveShowAll = false; render(); }));
  root.querySelectorAll('[data-order-status]').forEach(sel=>sel.addEventListener('change', e=>{
    moveOrder(sel.dataset.orderStatus, e.target.value, sel.closest('[data-order-row]'));
  }));
  root.querySelectorAll('[data-order-next]').forEach(b=>b.addEventListener('click', ()=>{
    b.disabled = true; moveOrder(b.dataset.orderNext, b.dataset.to, b.closest('[data-order-row]'));
  }));
  const more = root.querySelector('#arch-more'); if(more) more.addEventListener('click',()=>{ archiveShowAll = true; render(); });
  root.querySelector('#toggle-sound').addEventListener('click',()=>{
    soundEnabled = !soundEnabled;
    localStorage.setItem('qrmenu_sound_v1', soundEnabled ? 'on' : 'off');
    unlockAudio(); render();
  });
  root.querySelector('#test-sound').addEventListener('click',()=>{ unlockAudio(); playOrderSound(true); });
}

/* --- Yönetim: Ayarlar --- */
function renderAdminSettings(root){
  const s = state.settings;
  root.innerHTML = `
    <div class="card">
      <h3>İşletme Bilgisi</h3>
      <div class="field"><label>İşletme Adı</label><input type="text" id="s-name" value="${escapeHtml(s.businessName)}"></div>
      <div class="field"><label>Slogan</label><input type="text" id="s-tagline" value="${escapeHtml(s.tagline||'')}" placeholder="Pilavdan daha fazlası"></div>
      <div class="field-row">
        <div class="field"><label>Çalışma Saatleri (örn. 11:00 - 22:00)</label><input type="text" id="s-hours" value="${escapeHtml(s.hours||'')}" placeholder="11:00 - 22:00"></div>
        <div class="field"><label>Para Birimi Simgesi</label><input type="text" id="s-cur" value="${escapeHtml(s.currency||'₺')}" maxlength="3"></div>
      </div>
      <div class="field"><label>Dükkan Konumu (adres veya semt)</label><input type="text" id="s-loc" value="${escapeHtml(s.location||'')}" placeholder="Örn. Kadıköy, İstanbul"></div>
      <div class="field"><label>Harita Linki (opsiyonel — Google Maps'ten "Paylaş" linki)</label><input type="text" id="s-maps" value="${escapeHtml(s.mapsUrl||'')}" placeholder="https://maps.app.goo.gl/..."></div>
      <p class="hint" style="margin-top:-4px;margin-bottom:12px;">Saat "11:00 - 22:00" biçiminde yazılırsa menüde "Şu an açık / kapalı" bilgisi otomatik gösterilir.</p>
      <button class="btn btn-primary btn-sm" id="save-settings">Kaydet</button>
    </div>
    <div class="card">
      <h3>Mutfak Bildirimleri (telefon kilitliyken bile)</h3>
      <div class="field"><label class="chk"><input type="checkbox" id="nt-on" ${ntfyCfg().enabled?'checked':''}> Yeni siparişte telefona sesli bildirim gönder</label></div>
      <div class="field"><label>Bildirim kanalınız (gizli tutun)</label>
        <div class="nt-topic"><code id="nt-topic">${escapeHtml(ntfyCfg().topic)}</code><button type="button" class="btn btn-sm" id="nt-copy">Kopyala</button></div></div>
      <ol class="geo-steps" style="font-size:13.5px;margin-bottom:14px;">
        <li>Telefona ücretsiz <b>ntfy</b> uygulamasını indirin (App Store / Google Play).</li>
        <li>Uygulamada <b>+</b> (Abone ol / Subscribe) → yukarıdaki <b>kanal adını</b> yapıştırın → sunucu <b>ntfy.sh</b> kalsın → <b>Abone ol</b>.</li>
        <li>Bildirim izni verin. iPhone'da <b>Ayarlar → Bildirimler → ntfy</b> içinde <b>Sesler</b> ve <b>Kilitli Ekran</b> açık olsun.</li>
        <li><b>Test Bildirimi Gönder</b>'e basın; birkaç saniye içinde telefona düşmeli.</li>
      </ol>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <button class="btn btn-primary btn-sm" id="nt-save">Kaydet</button>
        <button class="btn btn-sm" id="nt-test">Test Bildirimi Gönder</button>
        <button class="btn btn-sm btn-ghost" id="nt-new">Yeni Kanal Oluştur</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;">
        <span class="hint" style="margin:0;">Bu cihazın tarayıcı bildirimi:</span><span class="nt-status" id="nt-perm"></span>
        <button class="btn btn-sm btn-ghost" id="nt-perm-btn">İzin ver</button>
      </div>
      <p class="hint">Kanal adını bilen herkes bildirimleri görebilir; başkasıyla paylaşmayın. Paylaşıldıysa "Yeni Kanal Oluştur" → Kaydet deyip ntfy'de yeni kanala abone olun. Bildirimde müşteri adı ve tutar ntfy.sh sunucusu üzerinden iletilir.</p>
    </div>
    <div class="card">
      <h3>Kampanya Pop-up</h3>
      <div class="field"><label class="chk"><input type="checkbox" id="cp-enabled" ${campaign().enabled?'checked':''}> Site açılınca kampanya penceresini göster</label>
        <div class="hint">Her müşteriye tarayıcı oturumu başına bir kez gösterilir.</div></div>
      <div class="field"><label>Başlık</label><input type="text" id="cp-title" maxlength="60" value="${escapeHtml(campaign().title)}"></div>
      <div class="field"><label>Metin</label><textarea id="cp-text" rows="3" maxlength="300">${escapeHtml(campaign().text)}</textarea></div>
      <div class="field"><label>Buton yazısı</label><input type="text" id="cp-btn" maxlength="30" value="${escapeHtml(campaign().button)}"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" id="cp-save">Kampanyayı Kaydet</button>
        <button class="btn btn-sm" id="cp-preview">Önizle</button>
        <button class="btn btn-sm btn-ghost" id="cp-reset">Varsayılana Dön</button>
      </div>
    </div>
    <div class="card">
      <h3>Yönetici PIN'ini Değiştir</h3>
      <div class="field-row">
        <div class="field"><label>Mevcut PIN</label><input type="password" id="s-pin-old"></div>
        <div class="field"><label>Yeni PIN</label><input type="password" id="s-pin-new"></div>
      </div>
      <button class="btn btn-sm" id="save-pin">PIN'i Güncelle</button>
      <p class="hint">Bu PIN sadece rastgele ziyaretçilerin panele girmesini engeller; hassas veriler için gerçek bir güvenlik katmanı değildir.</p>
    </div>
  `;
  root.querySelector('#save-settings').addEventListener('click',()=>{
    s.businessName = root.querySelector('#s-name').value.trim() || 'RiceMore';
    s.tagline = root.querySelector('#s-tagline').value.trim();
    s.hours = root.querySelector('#s-hours').value.trim();
    s.location = root.querySelector('#s-loc').value.trim();
    const maps = root.querySelector('#s-maps').value.trim();
    s.mapsUrl = /^https:\/\//i.test(maps) ? maps : '';
    s.currency = root.querySelector('#s-cur').value.trim() || '₺';
    saveState(); showToast('Ayarlar kaydedildi');
  });
  const ntTopicEl = root.querySelector('#nt-topic');
  const ntPerm = ()=>{
    const el = root.querySelector('#nt-perm'), btn = root.querySelector('#nt-perm-btn');
    const st = !('Notification' in window) ? 'unsupported' : Notification.permission;
    el.textContent = {granted:'Açık', denied:'Engellendi', default:'Sorulmadı', unsupported:'Desteklenmiyor'}[st];
    el.className = 'nt-status ' + (st==='granted'?'ok': st==='denied'?'bad':'');
    btn.style.display = st==='default' ? '' : 'none';
  };
  ntPerm();
  root.querySelector('#nt-perm-btn').addEventListener('click', ()=>{ askNotifyPermission().then(ntPerm); });
  root.querySelector('#nt-copy').addEventListener('click', ()=>{
    const t = ntTopicEl.textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>showToast('Kanal adı kopyalandı'))
      .catch(()=>{ const r = document.createRange(); r.selectNodeContents(ntTopicEl); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); showToast('Kanal adı seçildi, kopyalayın'); });
  });
  root.querySelector('#nt-new').addEventListener('click', ()=>{ ntTopicEl.textContent = newTopic(); showToast('Yeni kanal oluşturuldu. Kalıcı olması için Kaydet\'e basın.'); });
  root.querySelector('#nt-save').addEventListener('click', ()=>{ s.ntfyEnabled = root.querySelector('#nt-on').checked; s.ntfyTopic = ntTopicEl.textContent.trim(); saveState(); showToast('Bildirim ayarları kaydedildi'); });
  root.querySelector('#nt-test').addEventListener('click', ()=>{
    const keep = s.ntfyTopic; s.ntfyTopic = ntTopicEl.textContent.trim();
    notifyKitchen(null, true).then(ok=> showToast(ok ? 'Test bildirimi gönderildi — telefonunuzu kontrol edin' : 'Gönderilemedi. İnternet bağlantısını kontrol edin.', ok?'success':''));
    s.ntfyTopic = keep;
  });
  const readCampaign = ()=>({
    enabled: root.querySelector('#cp-enabled').checked,
    title: root.querySelector('#cp-title').value.trim() || CAMPAIGN_DEFAULT.title,
    text: root.querySelector('#cp-text').value.trim() || CAMPAIGN_DEFAULT.text,
    button: root.querySelector('#cp-btn').value.trim() || CAMPAIGN_DEFAULT.button
  });
  root.querySelector('#cp-save').addEventListener('click',()=>{ s.campaign = readCampaign(); saveState(); showToast('Kampanya kaydedildi'); });
  root.querySelector('#cp-preview').addEventListener('click',()=>{ const keep = s.campaign; s.campaign = readCampaign(); showCampaign(true); s.campaign = keep; });
  root.querySelector('#cp-reset').addEventListener('click',()=>{
    root.querySelector('#cp-enabled').checked = true; root.querySelector('#cp-title').value = CAMPAIGN_DEFAULT.title;
    root.querySelector('#cp-text').value = CAMPAIGN_DEFAULT.text; root.querySelector('#cp-btn').value = CAMPAIGN_DEFAULT.button;
  });
  root.querySelector('#save-pin').addEventListener('click',()=>{
    const oldPin = root.querySelector('#s-pin-old').value;
    const newPin = root.querySelector('#s-pin-new').value.trim();
    if(oldPin !== (s.adminPin||'1234')){ showToast('Mevcut PIN yanlış'); return; }
    if(!newPin){ showToast('Yeni PIN boş olamaz'); return; }
    s.adminPin = newPin; saveState(); showToast('PIN güncellendi');
  });
}

registerSW();
initFirebase();
</script>
